<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- Installs on an iPhone Home Screen and in browsers as a web app. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kriyan" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070709" media="(prefers-color-scheme: dark)" />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* The page background before the app draws, so there is no flash. Written by `bun run tokens`. */
      /* FIRST-PAINT */ html, body { background: #ffffff; color-scheme: light; } @media (prefers-color-scheme: dark) { html, body { background: #070709; color-scheme: dark; } } /* /FIRST-PAINT */
    </style>
  </head>
  <body>
    <noscript>Kriyan needs JavaScript to run.</noscript>
    <div id="root"></div>
  </body>
</html>
