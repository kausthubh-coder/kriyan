    if (slots.length) h += `<div class="tl-gap slot"><span>Free slots: ${slots.map((m) => `<button class="btn-sm dark" data-act="place-at" data-min="${m}">${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}</button>`).join(" ")}</span></div>`;
    return h + "</div>";
  }

  function freeSlots(o, dur) {
    const busy = timedOf(dayItems(o)).map((i) => [i.start.getHours() * 60 + i.start.getMinutes(), ((endOf(i) || new Date(i.start.getTime() + 1800000)).getHours() * 60 + (endOf(i) || new Date(i.start.getTime() + 1800000)).getMinutes())]);
    const need = dur || 30;
    const from = o === 0 ? Math.ceil((NOW.getHours() * 60 + NOW.getMinutes()) / 30) * 30 : 8 * 60;
    const out = [];
    for (let m = from; m + need <= 21 * 60 && out.length < 4; m += 30) {
      if (!busy.some(([a, b]) => m < b && m + need > a)) { out.push(m); m += need - 30 + 30; }
    }
    return out;
  }

  // ---------- quick add ----------
  const EXAMPLE = "Gym tomorrow 7am for 45m every Mon Wed Fri remind 10m before #health";
  function hlHTML(text, p) {
    let h = "", last = 0;
    for (const t of p.tokens) { h += esc(text.slice(last, t.start)) + `<span class="tok">${esc(text.slice(t.start, t.end))}</span>`; last = t.end; }
    return h + esc(text.slice(last)) + "​";
  }
  function dateWord(d) { const o = dayOffset(d); return o === 0 ? "Today" : o === 1 ? "Tomorrow" : K.fmtDate(d); }
  function chipsHTML(p) {
    const c = (set, icon, label, extra = "") => `<span class="chip ${set ? "set" : "ghost"} ${extra}">${ic(icon)}${esc(label)}</span>`;
    let h = c(p.date, "cal", p.date ? dateWord(p.date) : "No date");
    h += c(p.time, "clock", p.time || "No time");
    h += `<span class="chip ${p.duration ? "set" : "ghost dash"}"${p.duration ? "" : W("nolen")}>${ic("hourglass")}${p.duration ? K.fmtDur(p.duration) : "No length"}</span>`;
    h += c(p.repeat, "repeat", p.repeat || "No repeat");
    if (p.reminders.length) h += p.reminders.map((r) => c(true, "bell", r)).join("");
    else h += c(false, "bell", "No reminder");
    h += c(p.space, "inbox", p.space ? K.spacePath(p.space) : "No space");
    return h;
  }
  function addLabel(p) {
    if (S.add.kind === "habit") return "Add habit";
    const noun = S.add.kind === "event" ? "event" : "task";
    if (!p.date) return S.add.kind === "event" ? "Add event to today" : "Add to inbox";
    return `Add ${noun} to ${dateWord(p.date).replace("Today", "today").replace("Tomorrow", "tomorrow")}`;
  }
  function addHTML(kind) {
    const p = K.parseQuickAdd(S.add.text);
    const seg = ["task", "event", "habit"].map((k) => `<button class="${S.add.kind === k ? "on" : ""}" data-act="add-kind" data-k="${k}">${k[0].toUpperCase() + k.slice(1)}</button>`).join("");
    return `<div class="scrim" data-act="add-close"></div><div class="${kind === "sheet" ? "bs" : "modal"}" role="dialog" aria-modal="true" aria-label="Quick add">${kind === "sheet" ? '<div class="grab"></div>' : ""}
      <div class="add-top"><div class="seg">${seg}</div><button class="iconbtn" data-act="add-close" aria-label="Close">${ic("x")}</button></div>
      <div class="qa"${W("qa")}><div class="hl" id="qa-hl" aria-hidden="true">${hlHTML(S.add.text, p)}</div><textarea id="qa-in" rows="2" placeholder="${S.add.kind === "event" ? "Event title" : S.add.kind === "habit" ? "Habit, like Read 20 pages every day" : "Task title"}" spellcheck="false" aria-label="What do you want to do?">${esc(S.add.text)}</textarea></div>
      <div class="chips" id="qa-chips">${chipsHTML(p)}</div>
      <p class="hint" id="qa-hint">${S.add.text ? "Words in blue set the details. Delete them to undo." : `Type it like you'd say it. <button data-act="add-example">Try an example</button>`}</p>
      <button class="btn-full" id="qa-btn" data-act="add-submit" ${p.title ? "" : "disabled"}>${addLabel(p)}</button></div>`;
  }
  function updateAdd() {
    const p = K.parseQuickAdd(S.add.text);
    const hl = document.getElementById("qa-hl"); if (!hl) return;
    whyUsed = new Set();
    hl.innerHTML = hlHTML(S.add.text, p);
    document.getElementById("qa-chips").innerHTML = chipsHTML(p);
    document.getElementById("qa-hint").innerHTML = S.add.text ? "Words in blue set the details. Delete them to undo." : `Type it like you'd say it. <button data-act="add-example">Try an example</button>`;
    const b = document.getElementById("qa-btn"); b.disabled = !p.title; b.textContent = addLabel(p);
  }
  function submitAdd() {
    const p = K.parseQuickAdd(S.add.text);
    if (!p.title) return;
    const id = `n${++uid}`;
    if (S.add.kind === "habit") {
      commit(`Added habit "${p.title}"`, () => { S.habits.push({ id, title: p.title, space: p.space || "health", rule: p.repeat || "Every day", target: p.duration ? K.fmtDur(p.duration) : "", history: Array(28).fill(null), todayDone: false }); });
      S.add.open = false; render(); return;
    }
    let start = null;
    if (p.date && p.time) { const [hh, mm] = p.time.split(":").map(Number); start = new Date(p.date.getFullYear(), p.date.getMonth(), p.date.getDate(), hh, mm); }
    const item = { id, kind: S.add.kind === "event" ? "event" : "task", title: p.title, space: p.space, duration: p.duration, repeat: p.repeat, reminders: p.reminders, notes: "", start, end: start && p.duration ? new Date(start.getTime() + p.duration * 60000) : null, anytime: !start };
    const o = p.date ? dayOffset(p.date) : 0;
    const msg = !p.date && item.kind === "task" ? `Added "${p.title}" to the inbox` : o === 0 ? `Added "${p.title}" to today` : `Added "${p.title}" to ${K.fmtDate(p.date)}`;
    S.add.open = false;
    commit(msg, () => {
      if (!p.date && item.kind === "task") S.inbox.unshift(item);
      else if (o === 0) S.items.push(item);
      else S.week.push({ ...item, day: o });
    });
  }

  // ---------- task detail ----------
  const DUR = [null, 15, 30, 45, 60, 90, 120, 180];
  const REM_TIMED = ["At start", "5 min before", "10 min before", "30 min before", "1 hour before", "Day before, 09:00", "When I get home"];
  const REM_UNTIMED = ["At 09:00", "At 13:00", "At 18:00", "Tomorrow, 09:00", "When I get home"];
  const DAYL = ["M", "T", "W", "T", "F", "S", "S"];
  const DAYN = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  function rrOf(it) {
    if (!S.rr[it.id]) {
      const r = it.repeat || "";
      const days = DAYN.map((d) => new RegExp(`\\b${d}`, "i").test(r));
      S.rr[it.id] = { custom: false, every: 1, unit: "week", days: days.some(Boolean) ? days : DAYN.map((_, i) => it.start ? (it.start.getDay() + 6) % 7 === i : i === 3), after: /after/i.test(r), ends: /until/i.test(r) ? "date" : "never" };
    }
    return S.rr[it.id];
  }
  function rrText(r) {
    const unit = r.every === 1 ? r.unit : `${r.every} ${r.unit}s`;
    let t = r.every === 1 ? `Every ${unit}` : `Every ${unit}`;
    if (r.unit === "week") { const on = DAYN.filter((_, i) => r.days[i]); if (on.length) t += ` on ${joinAnd(on)}`; }
    if (r.after) t += ", counted from when you finish it";
    if (r.ends === "date") t += ", until Fri 13 Nov";
    if (r.ends === "count") t += ", 10 times";
    return t;
  }
  function taskHTML(it, where) {
    if (!it) return "";
    const isEv = it.kind === "event";
    const sp = it.space ? `<span class="spc" style="--h:${hueOf(it.space)}"><i></i>${esc(K.spacePath(it.space))}</span>` : `<span class="spc" style="--h:var(--faint)"><i></i>No space</span>`;
    const top = where === "phone"
      ? `<div class="topbar"><button class="back" data-act="close-task">${ic("chevL")}${S.screen === "week" ? "Week" : "Today"}</button>${sp}</div>`
      : `<div class="topbar">${sp}<button class="iconbtn" data-act="close-task" aria-label="Close">${ic("x")}</button></div>`;
    let h = `<div class="screen">${top}<div class="t-title">${tickBtn(it)}<h2 contenteditable="true" spellcheck="false" data-edit="title" data-id="${it.id}" aria-label="Title">${esc(it.title)}</h2></div>`;
    // when
    const e = endOf(it);
    let w1, w2;
    if (it.allDay) { w1 = `${ic("cal")}<b>All day</b>`; w2 = K.fmtDate(it.start); }
    else if (it.start && !it.anytime) { w1 = `${ic("clock")}<b class="tnum">${K.fmtTime(it.start)}</b>${e ? ` <span class="arr">→</span> <b class="tnum">${K.fmtTime(e)}</b> <span class="mut tnum">${K.fmtDur(it.duration)}</span>` : ` <span class="mut">No length</span>`}`; w2 = K.fmtDate(it.start); }
    else if (it.from) { w1 = `${ic("clock")}<b>Anytime</b>`; w2 = `On today, from ${K.fmtDate(it.from)}`; }
    else if (S.inbox.includes(it)) { w1 = `${ic("inbox")}<b>Not scheduled</b>`; w2 = "In the inbox. Place it in the week to timebox it."; }
    else { w1 = `${ic("clock")}<b>Anytime</b>`; w2 = it.day ? K.fmtDate(K.atDay(it.day)) : "Today"; }
    h += `<div class="when"${W("when")}><div class="w1">${w1}</div><div class="w2">${w2}</div></div>`;
    if (it.location) h += `<div class="drow">${ic("pin")}<span>${esc(it.location)}</span></div>`;
    if (it.due && !isEv) h += `<div class="drow"${W("due")}>${ic("flag")}<span>Due ${K.fmtDate(it.due)}, ${K.fmtTime(it.due)}</span><span class="right">${leftLabel(it.due)}</span></div>`;
    if (!isEv) {
      h += `<div class="blk"><div class="blk-h"><span>Length</span><span class="tnum" style="text-transform:none;letter-spacing:0">${it.duration ? K.fmtDur(it.duration) : "Optional"}</span></div><div class="chips">${DUR.map((d) => `<button class="chip ${d === (it.duration ?? null) ? "on" : d === null ? "ghost dash" : "ghost"}" data-act="dur" data-v="${d ?? ""}" aria-pressed="${d === (it.duration ?? null)}">${d ? K.fmtDur(d) : "No length"}</button>`).join("")}</div></div>`;
    }
    // repeat
    h += `<button class="drow" data-act="rep-open" aria-expanded="${S.repeatOpen}">${ic("repeat")}<span>${esc(it.repeat || "Doesn't repeat")}</span>${ic(S.repeatOpen ? "chevD" : "chevR")}</button>`;
    if (S.repeatOpen) {
      const r = rrOf(it);
      const presets = ["Never", "Every day", "Every weekday", "Every week", "Every month", "Every year", "Custom"];
      const cur = r.custom ? "Custom" : it.repeat ? (presets.find((p) => it.repeat === p) || "Custom") : "Never";
      h += `<div class="rep"${W("repeat")}><div class="lbl">Repeat</div><div class="chips" style="margin-top:0">${presets.map((p) => `<button class="chip ${p === cur ? "on" : "ghost"}" data-act="rep-preset" data-v="${p}">${p}</button>`).join("")}</div>`;
      if (cur === "Custom") {
        h += `<div class="lbl">Every</div><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="stepper"><button data-act="rep-every" data-v="-1" aria-label="Fewer">−</button><b>${r.every}</b><button data-act="rep-every" data-v="1" aria-label="More">+</button></span><span class="seg">${["day", "week", "month", "year"].map((u) => `<button class="${r.unit === u ? "on" : ""}" data-act="rep-unit" data-v="${u}">${r.every === 1 ? u : u + "s"}</button>`).join("")}</span></div>`;
        if (r.unit === "week") h += `<div class="lbl">On</div><div class="days">${DAYL.map((d, i) => `<button class="${r.days[i] ? "on" : ""}" data-act="rep-day" data-v="${i}" aria-pressed="${r.days[i]}" aria-label="${DAYN[i]}">${d}</button>`).join("")}</div>`;
        h += `<div class="togrow"><span>Count from when I finish it</span><button class="switch" role="switch" aria-checked="${r.after}" data-act="rep-after" aria-label="Count from when I finish it"></button></div>`;
        h += `<div class="lbl">Ends</div><span class="seg">${[["never", "Never"], ["date", "On Fri 13 Nov"], ["count", "After 10 times"]].map(([k, l]) => `<button class="${r.ends === k ? "on" : ""}" data-act="rep-ends" data-v="${k}">${l}</button>`).join("")}</span>`;
        h += `<p class="rule">${esc(rrText(r))}</p>`;
      }
      if (it.repeat) h += `<p class="note">Changes apply to this and later occurrences.</p>`;
      h += `</div>`;
    }
    // reminders
    const rems = it.reminders || [];
    h += `<div class="blk"${W("rem")}><div class="blk-h"><span>Reminders</span><span class="tnum">${rems.length || ""}</span></div>${rems.map((r, i) => `<div class="rem">${ic("bell")}<span>${esc(r)}</span><button class="iconbtn" data-act="rem-del" data-v="${i}" aria-label="Remove reminder ${esc(r)}">${ic("x")}</button></div>`).join("")}<button class="addline" data-act="rem-menu" aria-expanded="${S.remMenu}">${ic("plus")}Add reminder</button>${S.remMenu ? `<div class="menu">${(it.start && !it.anytime ? REM_TIMED : REM_UNTIMED).filter((r) => !rems.includes(r)).map((r) => `<button class="chip ghost" data-act="rem-add" data-v="${esc(r)}">${esc(r)}</button>`).join("")}</div>` : ""}</div>`;
    // goal
    if (it.goal) {
      const g = K.goals.find((x) => x.id === it.goal);
      if (g) { const done = g.milestones.filter((m) => m.done).length; h += `<div class="blk"><div class="blk-h"><span>Goal</span></div><button class="goalmini" data-act="nav" data-to="goals">${ic("target")}<div style="flex:1;text-align:left"><div class="t">${esc(g.title)}</div><div class="m tnum">${done} of ${g.milestones.length} steps · ${daysLeft(g.due)} days left</div><div class="segbar">${g.milestones.map((m) => `<i class="${m.done ? "on" : ""}"></i>`).join("")}</div></div></button></div>`; }
    }
    // steps + notes
    if (!isEv) {
      const st = it.subtasks || [];
      h += `<div class="blk"><div class="blk-h"><span>Steps</span><span class="tnum">${st.length ? `${st.filter((s) => s.done).length} of ${st.length}` : ""}</span></div>${st.map((s, i) => `<div class="sub-r ${s.done ? "on" : ""}"><button class="circ ${s.done ? "on" : ""}" data-act="sub-tick" data-v="${i}" role="checkbox" aria-checked="${s.done}" aria-label="${esc(s.title)}">${s.done ? ic("check") : ""}</button><span>${esc(s.title)}</span></div>`).join("")}<div class="sub-r"><span class="circ" style="border-style:dashed"></span><input class="sub-in" id="sub-new" placeholder="Add a step" aria-label="Add a step"></div></div>`;
    }
    h += `<div class="blk"><div class="blk-h"><span>Notes</span></div><div class="notes" contenteditable="true" data-edit="notes" data-id="${it.id}" data-placeholder="Write anything: links, context, what done looks like"${W("notes")}>${esc(it.notes || "")}</div></div>`;
    if (!isEv) {
      const tr = Math.round(it.tracked || 0);
      h += `<div class="track"><div><div class="blk-h" style="min-height:0">Time tracked</div><div class="tnum" style="font-size:15px;margin-top:2px">${K.fmtDur(tr) || "0m"}${it.duration ? ` of ${K.fmtDur(it.duration)}` : ""}</div></div><button class="btn-dark" data-act="focus-start" data-id="${it.id}">${ic("play")}Start focus</button></div>`;
      h += `<div class="tbar"${W("tbar")}><button data-act="menu" data-v="when" aria-expanded="${S.menu === "when"}">${ic("cal")}When</button><button data-act="menu" data-v="move" aria-expanded="${S.menu === "move"}">${ic("arrowR")}Move</button><button data-act="focus-start" data-id="${it.id}">${ic("timer")}Focus</button><button class="ic" data-act="del" data-id="${it.id}" aria-label="Delete task">${ic("trash")}</button></div>`;
      if (S.menu === "when") h += `<div class="pop" role="menu">${[[0, "Today"], [1, "Tomorrow"], [2, "This weekend"], [4, "Next week"], ["inbox", "Someday, in the inbox"]].map(([v, l]) => `<button data-act="when" data-v="${v}" role="menuitem">${l}<span>${typeof v === "number" ? K.fmtDate(K.atDay(v)) : ""}</span></button>`).join("")}</div>`;
      if (S.menu === "move") h += `<div class="pop" role="menu">${K.spaces.map((s) => `<button data-act="move" data-v="${s.id}" role="menuitem" style="--h:${HUE[s.hue]};${s.parent ? "padding-left:30px" : ""}"><span class="spdot" style="margin:0"></span>${esc(s.name)}${s.id === it.space ? "<span>Current</span>" : ""}</button>`).join("")}</div>`;
    }
    return h + `</div>`;
  }

  // ---------- focus ----------
  function focusInner() {
    const it = getAny(S.focus.id);
    if (!it) return "";
    const total = it.duration ? it.duration * 60 + S.focus.extra : null;
    const C = 2 * Math.PI * 126;
    const p = total ? Math.min(1, S.focus.elapsed / total) : 0;
    const e = endOf(it);
    const nextStep = (it.subtasks || []).findIndex((s) => !s.done);
    const after = timedOf(S.items).find((i) => it.start && i.start > it.start && i.id !== it.id && !i.done);
    const angle = p * 2 * Math.PI;
    const dx = 140 + 126 * Math.cos(angle), dy = 140 + 126 * Math.sin(angle);
    return `<div class="focus"><div class="topbar"><button class="back" data-act="focus-close">${ic("chevL")}Today</button><span class="mut" style="font-size:14px;font-weight:600">Focus</span></div>
      <h1 class="f-title">${esc(it.title)}</h1><p class="f-sub">${it.start && e ? `${K.fmtTime(it.start)} → ${K.fmtTime(e)} · ${K.fmtDur(it.duration)}` : "No length set, counting up"}</p>
      <div class="ringwrap"${W("ring")}><svg viewBox="0 0 280 280" aria-hidden="true"><circle cx="140" cy="140" r="126" fill="none" stroke="#232326" stroke-width="14"/><circle id="f-arc" cx="140" cy="140" r="126" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - p)}"/><circle id="f-dot" cx="${dx}" cy="${dy}" r="6" fill="#ff453a"/></svg>
        <div class="ringc"><div class="f-left" id="f-left" role="timer" aria-live="off">${total ? fmtHMS(total - S.focus.elapsed) : fmtHMS(S.focus.elapsed)}</div><div class="f-of">${total ? `left of ${K.fmtDur(Math.round(total / 60))}` : "focused"}</div></div></div>
      <div class="f-ctrl"><button class="ghost" data-act="focus-plus">+5 min</button><button class="f-play" data-act="focus-toggle" aria-label="${S.focus.running ? "Pause" : "Start"}">${ic(S.focus.running ? "pause" : "play")}</button><button class="ghost" data-act="focus-done">Done</button></div>
      <div class="f-card">${nextStep >= 0 ? `<div class="lbl">Next step</div><div class="sub-r"><button class="circ" data-act="focus-step" data-v="${nextStep}" aria-label="Tick off step">${""}</button><span>${esc(it.subtasks[nextStep].title)}</span></div>` : `<div class="lbl">Next step</div><p style="font-size:15px;margin-top:6px">${it.subtasks ? "All steps done" : "Just this task"}</p>`}${after ? `<p class="after">After this: ${esc(after.title)} at ${K.fmtTime(after.start)}</p>` : ""}</div></div>`;
  }
  function updateFocus() {
    const it = getAny(S.focus.id); if (!it) return;
    const total = it.duration ? it.duration * 60 + S.focus.extra : null;
    const el = document.getElementById("f-left"); if (!el) return;
    el.textContent = total ? fmtHMS(total - S.focus.elapsed) : fmtHMS(S.focus.elapsed);
    if (total) {
      const C = 2 * Math.PI * 126, p = Math.min(1, S.focus.elapsed / total);
      document.getElementById("f-arc").setAttribute("stroke-dashoffset", C * (1 - p));
      const a = p * 2 * Math.PI, dot = document.getElementById("f-dot");
      dot.setAttribute("cx", 140 + 126 * Math.cos(a)); dot.setAttribute("cy", 140 + 126 * Math.sin(a));
    }
  }
  setInterval(() => {
    if (S.screen !== "focus" || !S.focus.running) return;
    S.focus.elapsed += 1;
    const it = getAny(S.focus.id); if (it) it.tracked = (it.tracked || 0) + 1 / 60;
    updateFocus();
  }, 1000);

  // ---------- goals and habits ----------
  function goalsHTML() {
    const yf = K.timeLeft.yearFraction;
    const wkNow = Math.floor(yf * 52);
    const weeks = Array.from({ length: 52 }, (_, i) => `<i class="${i < wkNow ? "on" : i === wkNow ? "cur" : ""}"></i>`).join("");
    const sem = Array.from({ length: 13 }, (_, i) => `<i class="${i < 9 ? "on" : i === 9 ? "cur" : ""}"></i>`).join("");
    let h = `<div class="pg-head"><h1 class="h1">Goals and habits</h1><p class="sub">What you're working towards, and the time you still have.</p></div>`;
    h += `<div class="tlc"${W("timeleft")}><div class="tlcard"><b>${K.timeLeft.yearDaysLeft}</b><span>days left in 2026</span><div class="weeks" aria-hidden="true">${weeks}</div></div><div class="tlcard"><b>${K.timeLeft.semesterWeeksLeft} wks</b><span>left in the semester</span><div class="weeks" aria-hidden="true">${sem}</div></div><div class="tlcard"><b>${K.timeLeft.weekFreeHours}h</b><span>free this week, Thu to Sun</span><button class="btn-sm" style="margin-top:auto;align-self:flex-start" data-act="nav" data-to="week">Plan it</button></div></div>`;
    let g = `<h2 class="h2">Goals <span>${K.goals.length}</span></h2>`;
    K.goals.forEach((x, idx) => {
      const dl = daysLeft(x.due);
      let prog = "";
      if (x.milestones) {
        const d = x.milestones.filter((m) => m.done).length, left = x.milestones.length - d;
        const nx = x.milestones.find((m) => !m.done);
        prog = `<div class="segbar">${x.milestones.map((m) => `<i class="${m.done ? "on" : ""}"></i>`).join("")}</div><div class="row2"><span><b>${left} to go</b> of ${x.milestones.length} steps</span><span>Due ${K.fmtDate(x.due)} · ${dl} days left</span></div>${nx ? `<p class="next">Next: ${esc(nx.title)}${nx.of ? ` (${nx.progress} of ${nx.of})` : ""}</p>` : ""}`;
        if (x.hoursPlannedThisWeek) prog += `<div class="row2"><span>This week: <b>${x.hoursDoneThisWeek}h</b> of ${x.hoursPlannedThisWeek}h planned</span></div><div class="bar"><i style="width:${(x.hoursDoneThisWeek / x.hoursPlannedThisWeek) * 100}%"></i></div>`;
      } else if (x.metric) {
        const m = x.metric, left = m.of - m.value;
        prog = `<div class="bar"><i style="width:${(m.value / m.of) * 100}%"></i></div><div class="row2"><span><b>${left} to go</b> · ${m.value} of ${m.of} ${m.label}</span><span>${dl} days left</span></div>`;
      }
      g += `<div class="goal"${idx === 0 ? W("goal") : ""}><div class="t">${esc(x.title)}</div>${x.why ? `<div class="why">${esc(x.why)}</div>` : ""}${prog}</div>`;
    });
    let hb = `<h2 class="h2">Habits today <span>${S.habits.filter((x) => x.todayDone).length} of ${S.habits.length}</span></h2><div${W("habits")}>`;
    for (const x of S.habits) {
      const due = x.history.filter((v) => v !== null).length, done = x.history.filter((v) => v === 1).length;
      const missedYesterday = x.history[x.history.length - 1] === 0;
      hb += `<div class="hab"><div class="hab-top"><button class="tick ${x.todayDone ? "on" : ""}" data-act="habit" data-id="${x.id}" role="checkbox" aria-checked="${x.todayDone}" aria-label="${esc(x.title)} today">${ic(x.todayDone ? "habitOn" : "habit")}</button><div class="t">${esc(x.title)}<small>${esc(x.rule)}${x.target ? ` · ${esc(x.target)}` : ""}${missedYesterday && !x.todayDone ? " · today gets you back on track" : ""}</small></div><div class="cnt">${done} of ${due}<br><span style="font-size:11px">last 4 weeks</span></div></div><div class="dots" aria-label="${done} of ${due} days done in the last 4 weeks">${x.history.map((v) => `<i class="${v === 1 ? "" : v === 0 ? "miss" : "off"}"></i>`).join("")}</div></div>`;
    }
    hb += `</div><p class="note">Missed days stay quiet. Kriyan only nudges after two in a row, because one miss doesn't undo a habit.</p>`;
    return h + `<div class="g-cols"><section>${g}</section><section>${hb}</section></div>`;
  }

  // ---------- review ----------
  function reviewHTML() {
    const open = S.items.filter((i) => i.kind === "task" && !i.done && !i.habit);
    if (!S.rv.sel) S.rv.sel = open.map((i) => i.id);
    const sel = S.rv.sel.filter((id) => open.some((i) => i.id === id));
    const done = S.items.filter((i) => i.done);
    let h = `<span class="datechip">${K.fmtDate(NOW)}</span><h1 class="h1">Close the day</h1><p class="sub">These are still open. Anything you want to move to another day?</p>`;
    h += `<section${W("review")}><h2 class="h2">Still open <span>${open.length}</span></h2>`;
    h += open.length ? open.map((i) => `<div class="row" data-act="rv-sel" data-id="${i.id}" role="checkbox" aria-checked="${sel.includes(i.id)}" tabindex="0"><span class="sel-box ${sel.includes(i.id) ? "on" : ""}">${sel.includes(i.id) ? ic("check") : ""}</span><div class="body"><div class="t"><span>${esc(i.title)}</span></div><div class="m">${i.start && !i.anytime ? `${K.fmtTime(i.start)} · ` : ""}${i.from ? `From ${K.fmtDate(i.from)} · ` : ""}${i.repeat ? "Moves this occurrence only" : esc(K.spacePath(i.space))}</div></div>${i.duration ? `<div class="tm">${K.fmtDur(i.duration)}</div>` : ""}</div>`).join("") : `<p class="note">Everything's done or moved. Nice.</p>`;
    h += `</section><button class="btn-full" data-act="rv-move" data-v="1" ${sel.length ? "" : "disabled"}>Move ${sel.length} to tomorrow</button><button class="btn-out" data-act="rv-pick" aria-expanded="${S.rv.picking}">Pick another day</button>`;
    if (S.rv.picking) h += `<div class="chips">${[[2, "Sat 24 Oct"], [3, "Sun 25 Oct"], [4, "Next week"], ["inbox", "Inbox, no date"]].map(([v, l]) => `<button class="chip ghost" data-act="rv-move" data-v="${v}" ${sel.length ? "" : "disabled"}>${l}</button>`).join("")}</div>`;
    h += `<button class="link center" data-act="rv-done">I'm done reviewing</button>`;
    h += `<h2 class="h2">Done today <span>${done.length}</span></h2>${done.map(rowHTML).join("")}`;
    const tm = dayItems(1), c = counts(tm), fa = freeAfter(tm);
    const parts = []; if (c.ev) parts.push(plural(c.ev, "event")); if (c.tasks) parts.push(plural(c.tasks, "task"));
    h += `<h2 class="h2">Tomorrow, ${K.fmtDate(K.atDay(1))}</h2><p class="greet-s"><span class="d">You have</span> ${joinAnd(parts) || "nothing planned"}<span class="d">.</span>${fa ? ` <span class="d">Mostly free after</span> ${fa}<span class="d">.</span>` : ""}</p>${timedOf(tm).slice(0, 4).map(rowHTML).join("")}`;
    return h;
  }

  // ---------- agents ----------
  function agentsHTML() {
    const open = S.proposals.filter((p) => p.state === "open").length;
    let h = `<div class="pg-head"><h1 class="h1">Agents</h1><p class="sub">Your agents suggest. Nothing changes until you say yes.</p></div>`;
    h += `<section${W("proposals")}><h2 class="h2">Waiting for you <span>${open}</span></h2>`;
    for (const p of S.proposals) {
      h += `<article class="prop ${p.state === "open" ? "" : "done"}"><div class="pr-h"><span class="av">${p.from[0]}</span>${esc(p.from)} via ${esc(p.via)} · ${esc(p.when)}</div><div class="t">${esc(p.summary)}</div><div class="m">${esc(p.reason)}</div><div class="pr-a">${p.state === "open" ? `<button class="btn-dark" data-act="prop" data-id="${p.id}" data-v="accept">${ic("check")}Accept</button><button class="btn-sm" data-act="prop" data-id="${p.id}" data-v="decline">Decline</button>` : `<span class="res">${ic(p.state === "accepted" ? "check" : "x")}${esc(p.result)}</span>`}</div></article>`;
    }
    h += `</section><section><h2 class="h2">Connect an agent</h2><div class="conn"><div class="conn-r">${ic("link")}<div><div class="t">MCP server</div><div class="m">Claude, ChatGPT, Cursor or any MCP client</div></div><code>https://kriyan.app/mcp</code><button class="btn-sm" data-act="copy" data-v="https://kriyan.app/mcp">Copy URL</button></div><div class="conn-r">${ic("term")}<div><div class="t">Command line</div><div class="m">For Claude Code, Codex and your own scripts</div></div><code>npm i -g kriyan</code><button class="btn-sm" data-act="copy" data-v="npm i -g kriyan">Copy</button></div></div>`;
    h += `<pre class="term">${K.cli.map(esc).join("\n")}\n<span class="mut">Thu 22 Oct: 3 events, 6 tasks, 2 habits. Mostly free after 18:00.</span></pre></section>`;
    const perms = [["read", "Read your plan", "Today, the week, spaces and goals"], ["notes", "Read task notes", "So they understand the context"], ["add", "Add tasks without asking", "Off: they send a proposal instead"], ["move", "Move or delete tasks", "Off: always a proposal"]];
    h += `<section><h2 class="h2">What agents can do</h2>${perms.map(([k, l, m]) => `<div class="togrow" style="border-bottom:1px dotted var(--line)"><span>${l}<br><small class="mut" style="font-size:13px">${m}</small></span><button class="switch" role="switch" aria-checked="${S.perm[k]}" data-act="perm" data-v="${k}" aria-label="${l}"></button></div>`).join("")}</section>`;
    h += `<section><h2 class="h2">Recent activity</h2><div class="act"><span class="tm">10:12</span><span>Claude read your week and sent 2 proposals</span></div><div class="act"><span class="tm">08:03</span><span>Codex read the COMP2310 course page and sent 1 proposal</span></div><div class="act"><span class="tm">Wed 21 Oct</span><span>Claude added "Book the dentist" after you said yes</span></div></section>`;
    return h;
  }

  // ---------- week ----------
  function weekPhone() {
    const pl = S.placing && S.inbox.find((i) => i.id === S.placing);
    let h = `<div class="pg-head"><h1 class="h1">Week</h1><p class="sub">Mon 19 to Sun 25 Oct · ${K.timeLeft.weekFreeHours}h free</p></div>${weekStrip()}${timelineHTML(S.day, { place: true })}`;
    h += `<section${W("plan")}><h2 class="h2">Not scheduled yet <span>${S.inbox.length}</span></h2>`;
    if (pl) h += `<div class="placing"><p>Placing <b>${esc(pl.title)}</b>${pl.duration ? ` (${K.fmtDur(pl.duration)})` : ""}. Pick a day above, then a free slot in the timeline.</p><button class="btn-sm" data-act="place-cancel">Cancel</button></div>`;
    h += S.inbox.map((i) => `<div class="tray-r" style="--h:${hueOf(i.space)}"><span class="spdot"></span><div class="body"><div class="t">${esc(i.title)}</div><div class="m">${i.duration ? K.fmtDur(i.duration) : "No length"}${i.due ? ` · due ${K.fmtDate(i.due)}` : ""}</div></div><button class="btn-sm ${S.placing === i.id ? "dark" : ""}" data-act="place-start" data-id="${i.id}">${S.placing === i.id ? "Placing" : "Place"}</button></div>`).join("") || `<p class="note">Inbox is empty. Everything has a time.</p>`;
    return h + `</section>`;
  }
  function evBlock(it, hpx) {
    const m = it.start.getHours() * 60 + it.start.getMinutes();
    const top = ((m - H0 * 60) / 60) * hpx;
    const e = endOf(it);
    const ht = e ? Math.max(20, (K.minutesBetween(it.start, e) / 60) * hpx - 2) : 22;
    return `<div class="ev ${it.kind === "task" ? "task" : ""} ${it.done ? "dn" : ""} ${e ? "" : "pt"}" style="--h:${hueOf(it.space)};top:${top}px;height:${ht}px" data-act="open" data-id="${it.id}" title="${esc(it.title)}"><b>${esc(it.title)}</b>${ht > 34 ? `<span class="tnum">${K.fmtTime(it.start)}${e ? ` → ${K.fmtTime(e)}` : " · no length"}</span>` : ""}</div>`;
  }
  function weekDesk() {
    const hpx = HPX_WEEK;
    let h = `<div class="wkd" style="--hpx:${hpx}px"><aside class="wk-inbox"${W("plan")}><h2 class="h2">Not scheduled yet <span>${S.inbox.length}</span></h2><p class="sub" style="font-size:13px">Drag a task onto the week to timebox it.</p>`;
    h += S.inbox.map((i) => `<div class="ib" draggable="true" data-drag="${i.id}" style="--h:${hueOf(i.space)}"><span class="spdot"></span><div><div class="t">${esc(i.title)}</div><div class="m">${i.duration ? K.fmtDur(i.duration) : "No length"}${i.due ? ` · due ${K.fmtDate(i.due)}` : ""}</div></div></div>`).join("");
    h += `<p class="note">Free this week: ${K.timeLeft.weekFreeHours}h between Thu and Sun.</p></aside><div class="wk-main"><div class="wk-top"><h1 class="h1">Week</h1><span class="sub">Mon 19 to Sun 25 Oct</span></div><div class="wk-head"><div></div>`;
    for (let o = -3; o <= 3; o++) { const d = K.atDay(o); h += `<div class="${o === 0 ? "today" : ""}">${K.WEEKDAYS[d.getDay()]}<b>${d.getDate()}</b></div>`; }
    h += `</div><div class="wk-scroll" data-keep="wk"><div class="wk-grid"><div class="wk-times">${Array.from({ length: 15 }, (_, i) => `<div>${String(H0 + i).padStart(2, "0")}:00</div>`).join("")}</div>`;
    for (let o = -3; o <= 3; o++) {
      const its = timedOf(dayItems(o)).filter((i) => i.start.getHours() >= H0);
      h += `<div class="wcol ${o === 0 ? "today" : ""}" data-day="${o}">${its.map((i) => evBlock(i, hpx)).join("")}${o === 0 ? `<div class="calnow" style="top:${((NOW.getHours() * 60 + NOW.getMinutes() - H0 * 60) / 60) * hpx}px"></div>` : ""}</div>`;
    }
    return h + `</div></div></div></div>`;
  }
  function placeInbox(id, o, min) {
    const it = S.inbox.find((i) => i.id === id); if (!it) return;
    const start = K.atDay(o, Math.floor(min / 60), min % 60);
    commit(`Placed "${it.title}" on ${K.fmtDate(start)} at ${K.fmtTime(start)}`, () => {
      S.inbox = S.inbox.filter((i) => i.id !== id);
      const n = { ...it, kind: "task", start, end: it.duration ? new Date(start.getTime() + it.duration * 60000) : null, anytime: false, reminders: ["At start"] };
      if (o === 0) S.items.push(n); else S.week.push({ ...n, day: o });
    });
    S.placing = null; render();
  }

  // ---------- day calendar (desktop right panel) ----------
  function dayCal() {
    const hpx = HPX_DAY;
    const its = timedOf(S.items).filter((i) => i.start.getHours() >= H0);
    const ad = S.items.filter((i) => i.allDay);
    return `<div class="daycal" style="--hpx:${hpx}px"><h3>${K.fmtDate(NOW)}</h3>${ad.map((i) => `<button class="allday" data-act="open" data-id="${i.id}">${ic("star")}${esc(i.title)}</button>`).join("")}<div class="cal">${Array.from({ length: 15 }, (_, i) => `<div class="hr"><span>${String(H0 + i).padStart(2, "0")}:00</span></div>`).join("")}${its.map((i) => evBlock(i, hpx)).join("")}<div class="calnow" style="top:${((NOW.getHours() * 60 + NOW.getMinutes() - H0 * 60) / 60) * hpx}px"></div></div></div><div class="cal-up">${upcomingHTML()}</div>`;
  }

  // ---------- shells ----------
  function dockHTML() {
    const tabs = [["today", "sun", "Today"], ["week", "week", "Week"], ["goals", "target", "Goals"], ["agents", "spark", "Agents"]];
    const open = S.proposals.filter((p) => p.state === "open").length;
    return `<nav class="dock" aria-label="Main"><div class="dock-in"><div class="tabs">${tabs.map(([k, i, l]) => `<button class="${S.screen === k ? "on" : ""}" data-act="nav" data-to="${k}" aria-current="${S.screen === k ? "page" : "false"}">${ic(i)}${l}${k === "agents" && open ? `<span class="badge">${open}</span>` : ""}</button>`).join("")}</div><button class="fab" data-act="add-open" aria-label="Add a task">${ic("plus")}</button></div></nav>`;
  }
  function todayTools() {
    return `<div class="tools"><div class="seg" role="group" aria-label="View"><button class="${S.view === "list" ? "on" : ""}" data-act="view" data-v="list">List</button><button class="${S.view === "timeline" ? "on" : ""}" data-act="view" data-v="timeline">Timeline</button></div><button class="link" data-act="nav" data-to="review">Close the day</button></div>`;
  }
  function phoneHTML() {
    if (S.screen === "focus") return focusInner() + toastHTML();
    let body, cls = "";
    if (S.openTask) body = taskHTML(getAny(S.openTask), "phone");
    else if (S.screen === "today") { cls = "on-head"; body = `${headHTML(S.day)}<div class="sheet">${weekStrip()}${S.day === 0 ? upcomingHTML() : ""}${todayTools()}${S.view === "list" ? listHTML(S.day) : timelineHTML(S.day)}</div>`; }
    else if (S.screen === "week") body = `<div class="pg">${weekPhone()}</div>`;
    else if (S.screen === "goals") body = `<div class="pg">${goalsHTML()}</div>`;
    else if (S.screen === "review") body = `<div class="pg"><button class="back" data-act="nav" data-to="today">${ic("chevL")}Today</button>${reviewHTML()}</div>`;
    else if (S.screen === "agents") body = `<div class="pg">${agentsHTML()}</div>`;
    const dock = S.openTask || S.screen === "review" ? "" : dockHTML();
    const bg = S.add.open ? " inert" : "";
    return `<div class="phone ${cls}"${bg}>${body}</div>${dock ? `<div${bg}>${dock}</div>` : ""}${S.add.open ? addHTML("sheet") : ""}${toastHTML()}`;
  }
  function sideHTML() {
    const todayOpen = S.items.filter((i) => i.kind === "task" && !i.done && !i.habit).length;
    const weekCount = S.week.filter((w) => w.day > 0).length;
    const earlier = S.items.filter((i) => i.from && !i.done).length;
    const open = S.proposals.filter((p) => p.state === "open").length;
    const tile = (to, icon, n, l, color) => `<button class="tile ${S.screen === to && !(to === "today" && l === "From earlier") ? "" : ""}" data-act="nav" data-to="${to}"><div class="top"><i style="color:${color}">${ic(icon)}</i><b>${n}</b></div><span>${l}</span></button>`;
    const nav = (to, icon, l, cnt = "", red = false) => `<button class="nav ${S.screen === to ? "on" : ""}" data-act="nav" data-to="${to}" aria-current="${S.screen === to ? "page" : "false"}">${ic(icon)}${l}${cnt !== "" ? `<span class="cnt ${red ? "red" : ""}">${cnt}</span>` : ""}</button>`;
    let h = `<aside class="side"><div class="brand">Kriyan<i></i></div><button class="newbtn" data-act="add-open">${ic("plus")}New task<kbd>N</kbd></button>`;
    h += `<div class="tiles"${W("tiles")}>${tile("today", "sun", todayOpen, "Today", "#0a84ff")}${tile("week", "week", weekCount, "Coming up", "#e8980c")}${tile("week", "inbox", S.inbox.length, "Inbox", "#8a5cf6")}${tile("today", "undo", earlier, "From earlier", "#8e8e93")}</div>`;
    h += nav("today", "sun", "Today") + nav("week", "week", "Week") + nav("goals", "target", "Goals and habits") + nav("review", "moon", "Close the day") + nav("agents", "spark", "Agents", open || "", !!open);
    h += `<div class="h2">Spaces</div>${K.spaces.map((s) => `<div class="sp ${s.parent ? "child" : ""}" style="--h:${HUE[s.hue]}"><span class="spdot"></span>${esc(s.name)}</div>`).join("")}`;
    return h + `<div class="side-foot">${K.fmtDate(NOW)}, ${K.fmtTime(NOW)}</div></aside>`;
  }
  function desktopHTML() {
    let main;
    if (S.screen === "focus") main = `<main class="main dark">${focusInner()}</main>`;
    else if (S.screen === "today") {
      main = `<main class="main" style="overflow:hidden"><div class="td"><div class="col" data-keep="col"><div class="col-in">${headHTML(S.day, "card")}<div class="sheet-d">${weekStrip()}${todayTools()}${S.view === "list" ? listHTML(S.day) : timelineHTML(S.day)}</div></div></div><aside class="rp" data-keep="rp">${S.openTask ? taskHTML(getAny(S.openTask), "desk") : dayCal()}</aside></div></main>`;
    } else if (S.screen === "week") {
      main = `<main class="main" style="overflow:hidden">${S.openTask ? `<div class="td" style="grid-template-columns:minmax(0,1fr) 400px"><div style="min-width:0">${weekDesk()}</div><aside class="rp">${taskHTML(getAny(S.openTask), "desk")}</aside></div>` : weekDesk()}</main>`;
    } else if (S.screen === "goals") main = `<main class="main"><div class="dpg wide">${goalsHTML()}</div></main>`;
    else if (S.screen === "review") main = `<main class="main" style="overflow:hidden"><div class="td"><div class="col" data-keep="col"><div class="col-in" style="max-width:560px">${reviewHTML()}</div></div><aside class="rp">${S.openTask ? taskHTML(getAny(S.openTask), "desk") : dayCal()}</aside></div></main>`;
    else main = `<main class="main"><div class="dpg">${agentsHTML()}</div></main>`;
    return `<div class="desk"${S.add.open ? " inert" : ""}>${sideHTML()}${main}</div>${S.add.open ? addHTML("modal") : ""}${toastHTML()}`;
  }

  // ---------- render ----------
  let mode = null, lastAddOpen = false;
  function render() {
    whyUsed = new Set();
    const keep = {};
    document.querySelectorAll("[data-keep]").forEach((el) => (keep[el.dataset.keep] = el.scrollTop));
    const ae = document.activeElement;
    const focusKey = ae && ae.dataset ? ae.dataset.act + "|" + (ae.dataset.id || ae.dataset.v || ae.dataset.to || "") : null;
    mode = innerWidth >= 900 ? "desktop" : "phone";
    document.getElementById("app").innerHTML = mode === "desktop" ? desktopHTML() : phoneHTML();
    document.querySelectorAll("[data-keep]").forEach((el) => { if (keep[el.dataset.keep] != null) el.scrollTop = keep[el.dataset.keep]; });
    if (S.add.open && !lastAddOpen) {
      const ta = document.getElementById("qa-in");
      if (ta && P.get("screen") !== "add") { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
    } else if (focusKey && focusKey !== "undefined|") {
      const [a, v] = focusKey.split("|");
      const el = [...document.querySelectorAll(`[data-act="${a}"]`)].find((x) => (x.dataset.id || x.dataset.v || x.dataset.to || "") === v);
      if (el) el.focus({ preventScroll: true });
    }
    lastAddOpen = S.add.open;
    if (mode === "desktop" && S.screen === "week" && keep.wk == null) { const ws = document.querySelector(".wk-scroll"); if (ws) ws.scrollTop = 1 * HPX_WEEK; }
    if (window.KRIYAN_WHY) window.KRIYAN_WHY.refresh();
  }

  // ---------- actions ----------
  function setDone(it, v) {
    it.done = v;
    if (it.habit) { const hb = S.habits.find((x) => x.id === it.habit); if (hb) hb.todayDone = v; }
  }
  function moveItem(it, target) {
    // target: day offset number or "inbox"
    if (!isToday(it) && !S.week.includes(it)) return;
    S.items = S.items.filter((x) => x !== it);
    S.week = S.week.filter((x) => x !== it);
    const from = it.day || 0;
    if (target === "inbox") { S.inbox.unshift({ id: it.id, title: it.title, space: it.space, duration: it.duration, reminders: [] }); return; }
    const n = { ...it, from: undefined, day: target, start: it.start && !it.anytime ? shiftDays(it.start, target - from) : null, end: it.end ? shiftDays(it.end, target - from) : null, anytime: !it.start || !!it.anytime };
    if (target === 0) { delete n.day; S.items.push(n); } else S.week.push(n);
  }
  const A = {
    nav(el) { S.screen = el.dataset.to; S.openTask = null; S.menu = null; S.add.open = false; if (S.screen !== "today") S.day = S.screen === "week" ? S.day : 0; if (S.screen === "review") S.rv = { sel: null, picking: false }; scrollTo(0, 0); },
    day(el) { S.day = +el.dataset.day; },
    view(el) { S.view = el.dataset.v; },
    earlier() { S.earlierOpen = !S.earlierOpen; },
    open(el) { S.openTask = el.dataset.id; S.repeatOpen = false; S.remMenu = false; S.menu = null; if (mode === "phone") scrollTo(0, 0); },
    "close-task"() { S.openTask = null; S.menu = null; },
    tick(el) {
      const it = getAny(el.dataset.id); if (!it) return;
      if (!it.done) { commit(`Ticked off "${it.title}"`, () => setDone(it, true)); return "rendered"; }
      setDone(it, false);
    },
    habit(el) {
      const hb = S.habits.find((x) => x.id === el.dataset.id); if (!hb) return;
      const v = !hb.todayDone; hb.todayDone = v;
      S.items.filter((i) => i.habit === hb.id).forEach((i) => (i.done = v));
    },
    "add-open"() { S.add = { open: true, text: "", kind: "task" }; },
    "add-close"() { S.add.open = false; },
    "add-kind"(el) { S.add.kind = el.dataset.k; },
    "add-example"() { S.add.text = EXAMPLE; },
    "add-submit"() { submitAdd(); return "rendered"; },
    "focus-start"(el) { S.focus = { id: el.dataset.id, running: true, elapsed: 0, extra: 0 }; S.screen = "focus"; S.openTask = null; S.menu = null; scrollTo(0, 0); },
    "focus-close"() { S.screen = "today"; },
    "focus-toggle"() { S.focus.running = !S.focus.running; },
    "focus-plus"() { S.focus.extra += 300; },
    "focus-done"() { const it = getAny(S.focus.id); S.screen = "today"; S.focus.running = false; if (it) { commit(`Done: "${it.title}", ${K.fmtDur(Math.max(1, Math.round(S.focus.elapsed / 60)))} focused`, () => setDone(it, true)); return "rendered"; } },
    "focus-step"(el) { const it = getAny(S.focus.id); if (it && it.subtasks) it.subtasks[+el.dataset.v].done = true; },
    dur(el) { const it = getAny(S.openTask); if (!it) return; const v = el.dataset.v ? +el.dataset.v : null; it.duration = v; it.end = it.start && v && !it.anytime ? new Date(it.start.getTime() + v * 60000) : null; },
    "rep-open"() { S.repeatOpen = !S.repeatOpen; },
    "rep-preset"(el) {
      const it = getAny(S.openTask); const r = rrOf(it); const v = el.dataset.v;
      r.custom = v === "Custom";
      if (v === "Never") it.repeat = null; else if (v !== "Custom") it.repeat = v; else it.repeat = rrText(r);
    },
    "rep-every"(el) { const it = getAny(S.openTask), r = rrOf(it); r.every = Math.max(1, Math.min(30, r.every + +el.dataset.v)); it.repeat = rrText(r); },
    "rep-unit"(el) { const it = getAny(S.openTask), r = rrOf(it); r.unit = el.dataset.v; it.repeat = rrText(r); },
    "rep-day"(el) { const it = getAny(S.openTask), r = rrOf(it); r.days[+el.dataset.v] = !r.days[+el.dataset.v]; it.repeat = rrText(r); },
    "rep-after"() { const it = getAny(S.openTask), r = rrOf(it); r.after = !r.after; it.repeat = rrText(r); },
    "rep-ends"(el) { const it = getAny(S.openTask), r = rrOf(it); r.ends = el.dataset.v; it.repeat = rrText(r); },
    "rem-menu"() { S.remMenu = !S.remMenu; },
    "rem-add"(el) { const it = getAny(S.openTask); it.reminders = [...(it.reminders || []), el.dataset.v]; },
    "rem-del"(el) { const it = getAny(S.openTask); const r = it.reminders[+el.dataset.v]; commit(`Removed reminder "${r}"`, () => { it.reminders = it.reminders.filter((_, i) => i !== +el.dataset.v); }); return "rendered"; },
    "sub-tick"(el) { const it = getAny(S.openTask); const s = it.subtasks[+el.dataset.v]; s.done = !s.done; },
    menu(el) { S.menu = S.menu === el.dataset.v ? null : el.dataset.v; },
    when(el) {
      const it = getAny(S.openTask); if (!it) return;
      const v = el.dataset.v === "inbox" ? "inbox" : +el.dataset.v;
      if (S.inbox.includes(it)) { S.menu = null; if (v !== "inbox") { S.placing = it.id; S.screen = "week"; S.day = v; S.openTask = null; } return; }
      S.menu = null; S.openTask = null;
      commit(v === "inbox" ? `Moved "${it.title}" to the inbox` : `Moved "${it.title}" to ${K.fmtDate(K.atDay(v))}`, () => moveItem(it, v));
      return "rendered";
    },
    move(el) { const it = getAny(S.openTask); const sp = el.dataset.v; S.menu = null; commit(`Moved to ${K.spacePath(sp)}`, () => { it.space = sp; }); return "rendered"; },
    del(el) { const it = getAny(el.dataset.id); S.openTask = null; S.menu = null; commit(`Deleted "${it.title}"`, () => { S.items = S.items.filter((x) => x !== it); S.week = S.week.filter((x) => x !== it); S.inbox = S.inbox.filter((x) => x !== it); }); return "rendered"; },
    "place-start"(el) { S.placing = S.placing === el.dataset.id ? null : el.dataset.id; if (S.placing && S.day < 0) S.day = 0; },
    "place-cancel"() { S.placing = null; },
    "place-at"(el) { placeInbox(S.placing, S.day, +el.dataset.min); return "rendered"; },
    "rv-sel"(el) { const id = el.dataset.id; S.rv.sel = S.rv.sel.includes(id) ? S.rv.sel.filter((x) => x !== id) : [...S.rv.sel, id]; },
    "rv-pick"() { S.rv.picking = !S.rv.picking; },
    "rv-move"(el) {
      const v = el.dataset.v === "inbox" ? "inbox" : +el.dataset.v;
      const ids = S.rv.sel.filter((id) => S.items.some((i) => i.id === id && !i.done));
      if (!ids.length) return;
      commit(v === "inbox" ? `Moved ${ids.length} to the inbox` : `Moved ${ids.length} to ${K.fmtDate(K.atDay(v))}`, () => { ids.forEach((id) => moveItem(getAny(id), v)); });
      S.rv.picking = false; render(); return "rendered";
    },
    "rv-done"() { S.screen = "today"; S.toast = null; toast("Day closed. See you tomorrow."); scrollTo(0, 0); },
    prop(el) {
      const p = S.proposals.find((x) => x.id === el.dataset.id); const accept = el.dataset.v === "accept";
      commit(accept ? "Proposal accepted" : "Proposal declined", () => {
        const q = S.proposals.find((x) => x.id === p.id);
        q.state = accept ? "accepted" : "declined";
        if (!accept) { q.result = "Declined. The agent sees this so it can learn your preferences."; return; }
        if (p.kind === "schedule") {
          const it = S.inbox.find((i) => i.id === "i1");
          S.inbox = S.inbox.filter((i) => i.id !== "i1");
          S.week.push({ id: "i1", day: 2, kind: "task", title: "Thesis: draft section 2.1", space: "thesis", goal: "thesis", duration: 120, start: K.atDay(2, 14, 0), end: K.atDay(2, 16, 0), reminders: ["At start"], notes: it ? "" : "" });
          q.result = "Added to Sat 24 Oct, 14:00 → 16:00";
        } else if (p.kind === "split") {
          q.result = "Split into 3 steps on Write lab report 4";
        } else {
          const w = S.week.find((x) => x.title === "Submit lab report 4"); if (w) w.due = K.atDay(1, 17, 0);
          q.result = "Added to Fri 23 Oct, due 17:00";
        }
      });
      return "rendered";
    },
    perm(el) { S.perm[el.dataset.v] = !S.perm[el.dataset.v]; },
    copy(el) { try { navigator.clipboard && navigator.clipboard.writeText(el.dataset.v); } catch (e) {} toast("Copied"); },
    undo() { if (S.toast && S.toast.snap) Object.assign(S, S.toast.snap); S.toast = null; clearTimeout(toastT); },
  };

  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-act]");
    if (!el) { if (S.menu && !e.target.closest(".pop")) { S.menu = null; render(); } return; }
    const fn = A[el.dataset.act]; if (!fn) return;
    e.stopPropagation();
    if (fn(el, e) !== "rendered") render();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if (S.add.open) S.add.open = false; else if (S.menu) S.menu = null; else if (S.openTask) S.openTask = null; else if (S.screen === "focus") S.screen = "today"; else return;
      render(); return;
    }
    const t = e.target;
    if (t.id === "qa-in" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submitAdd(); return; }
    if (t.id === "sub-new" && e.key === "Enter" && t.value.trim()) {
      const it = getAny(S.openTask); it.subtasks = [...(it.subtasks || []), { title: t.value.trim(), done: false }]; render();
      const n = document.getElementById("sub-new"); if (n) n.focus(); return;
    }
    if ((e.key === "Enter" || e.key === " ") && t.matches(".row[data-act]")) { e.preventDefault(); t.click(); return; }
    const editing = t.isContentEditable || /INPUT|TEXTAREA/.test(t.tagName);
    if (!editing && (e.key === "n" || e.key === "N") && !e.metaKey && !e.ctrlKey) { e.preventDefault(); S.add = { open: true, text: "", kind: "task" }; render(); }
  });
  document.addEventListener("input", (e) => {
    const t = e.target;
    if (t.id === "qa-in") { S.add.text = t.value; updateAdd(); return; }
    if (t.dataset && t.dataset.edit) { const it = getAny(t.dataset.id); if (it) it[t.dataset.edit] = t.innerText; }
  });

  // drag to timebox (desktop week)
  let dragId = null, dropMin = null;
  const clearGhost = () => document.querySelectorAll(".ghostb").forEach((g) => g.remove());
  document.addEventListener("dragstart", (e) => { const c = e.target.closest && e.target.closest("[data-drag]"); if (!c) return; dragId = c.dataset.drag; e.dataTransfer.setData("text/plain", dragId); e.dataTransfer.effectAllowed = "move"; });
  document.addEventListener("dragover", (e) => {
    const col = e.target.closest && e.target.closest(".wcol"); if (!col || !dragId) return;
    e.preventDefault();
    const r = col.getBoundingClientRect();
    let min = Math.round(((e.clientY - r.top) / HPX_WEEK) * 4) * 15 + H0 * 60;
    min = Math.max(H0 * 60, Math.min(21 * 60 + 45, min));
    if (min === dropMin && col.querySelector(".ghostb")) return;
    dropMin = min; clearGhost();
    const it = S.inbox.find((i) => i.id === dragId);
    const g = document.createElement("div");
    g.className = "ghostb";
    g.style.top = `${((min - H0 * 60) / 60) * HPX_WEEK}px`;
    g.style.height = `${it && it.duration ? (it.duration / 60) * HPX_WEEK - 2 : 22}px`;
    g.textContent = `${String(Math.floor(min / 60)).padStart(2, "0")}:${String(min % 60).padStart(2, "0")}${it && it.duration ? "" : " · no length"}`;
    col.appendChild(g);
  });
  document.addEventListener("drop", (e) => {
    const col = e.target.closest && e.target.closest(".wcol"); if (!col || !dragId) return;
    e.preventDefault(); clearGhost();
    const id = dragId; dragId = null;
    placeInbox(id, +col.dataset.day, dropMin);
  });
  document.addEventListener("dragend", () => { dragId = null; clearGhost(); });

  let lastMode = innerWidth >= 900 ? "desktop" : "phone";
  addEventListener("resize", () => { const m = innerWidth >= 900 ? "desktop" : "phone"; if (m !== lastMode) { lastMode = m; render(); } });
  addEventListener("message", (e) => { if (e.data && e.data.screen) { const s = e.data.screen; S.openTask = s === "task" ? "lab" : null; S.add.open = s === "add"; if (s === "add") S.add.text = EXAMPLE; S.screen = ["task", "add"].includes(s) ? "today" : s; render(); } });
  render();
})();
</script>
</body>
