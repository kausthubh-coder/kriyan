<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kriyan, variant B2: assistant, task sheet, review and feel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff;--sheet:#fff;--side:#fafafa;--head:#0b0b0c;--head-ink:#fff;--head-dim:#8e8e93;
  --ink:#111113;--ink2:#3c3c41;--muted:#6a6a6f;--faint:#76767b;--line:#d4d4d9;--line2:#ececef;
  --fill:#f2f2f4;--fill2:#e6e6ea;--card:#f4f4f6;
  --red:#d42f25;--dot:#ff3b30;--badge-ink:#fff;--blue:#0a68d6;--blue-bg:rgba(10,104,214,.1);
  --shadow:0 1px 2px rgba(0,0,0,.06),0 10px 30px rgba(0,0,0,.10);
  --bar:#ffffff;--scrim:rgba(0,0,0,.32);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#000;--sheet:#151517;--side:#0c0c0d;--head:#000;--head-ink:#fff;--head-dim:#8e8e93;
  --ink:#f3f3f5;--ink2:#d0d0d5;--muted:#a1a1a7;--faint:#8e8e94;--line:#38383d;--line2:#232326;
  --fill:#232326;--fill2:#2e2e32;--card:#1d1d20;
  --red:#ff5a50;--dot:#ff453a;--badge-ink:#000;--blue:#5aa8ff;--blue-bg:rgba(90,168,255,.16);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.5);
  --bar:#1e1e21;--scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}}
:root[data-theme=dark]{
  --bg:#000;--sheet:#151517;--side:#0c0c0d;--head:#000;--head-ink:#fff;--head-dim:#8e8e93;
  --ink:#f3f3f5;--ink2:#d0d0d5;--muted:#a1a1a7;--faint:#8e8e94;--line:#38383d;--line2:#232326;
  --fill:#232326;--fill2:#2e2e32;--card:#1d1d20;
  --red:#ff5a50;--dot:#ff453a;--badge-ink:#000;--blue:#5aa8ff;--blue-bg:rgba(90,168,255,.16);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.5);
  --bar:#1e1e21;--scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
.tnum{font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mut{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Joi head ---------- */
.p-head{background:var(--head);color:var(--head-ink);padding:calc(env(safe-area-inset-top) + 22px) 22px 30px}
.p-head.card{border-radius:24px;padding:26px 28px 26px}
.dayrow{display:flex;justify-content:space-between;align-items:flex-start}
.dayname{font-size:36px;font-weight:700;letter-spacing:-.035em;line-height:1}
.dayname i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dot);margin-left:4px;position:relative;top:-5px}
.datebox{text-align:right;color:var(--head-dim);font-size:14px;line-height:1.25;font-weight:500;padding-top:2px}
.greet{margin-top:22px;font-size:22px;font-weight:600;line-height:1.34;letter-spacing:-.018em;max-width:34ch;text-wrap:pretty}
.greet .d{color:var(--head-dim)}
.greet svg.i{width:19px;height:19px;stroke-width:1.9;vertical-align:-3px;margin-right:2px}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:16px;font-size:13px;font-weight:600}
.stats span{display:inline-flex;align-items:center;gap:5px}
.stats svg.i{width:15px;height:15px;stroke-width:2}

/* ---------- Phone shell ---------- */
.phone{min-height:100dvh;max-width:560px;margin:0 auto;background:var(--sheet);position:relative}
.phone.on-head{background:linear-gradient(var(--head) 0 50%,var(--sheet) 50%)}
.sheet{background:var(--sheet);border-radius:28px 28px 0 0;padding:16px 18px 130px;min-height:60dvh;position:relative}
.pg{padding:calc(env(safe-area-inset-top) + 20px) 20px 130px}
.pg-head{margin-bottom:18px}
.h1{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.sub{color:var(--muted);font-size:15px;margin-top:4px}
.h2{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:26px 0 6px}
.h2 span{font-variant-numeric:tabular-nums}

/* week strip */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding-bottom:10px;border-bottom:1px dotted var(--line)}
.wk button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:12px;border:1px solid transparent;min-height:52px}
.wk .n{font-size:17px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.wk .d{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.wk .sel{border-color:var(--line)}
.wk .sel .n{color:var(--ink);font-weight:600}
.wk .today .d{color:var(--red)}
.wk .past .n{color:var(--faint)}

/* upcoming (Notion Calendar) */
.up{margin-top:14px;background:var(--card);border-radius:18px;padding:14px 14px 14px 16px;display:flex;align-items:center;gap:12px}
.up-txt{flex:1;min-width:0}
.up-l{font-size:12px;font-weight:600;color:var(--muted)}
.up-t{font-size:16px;font-weight:600;letter-spacing:-.01em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up-m{font-size:14px;color:var(--ink2);margin-top:1px}
.up-m span{color:var(--muted);margin-left:4px}
.btn-dark{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 16px;font-size:14px;font-weight:600;white-space:nowrap;min-height:44px}
.btn-dark svg.i{width:15px;height:15px}
.btn-dark:active,.btn-full:active{transform:scale(.97)}
.btn-sm{display:inline-flex;align-items:center;gap:6px;background:var(--fill);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;min-height:34px;white-space:nowrap}
.btn-sm.dark{background:var(--ink);color:var(--bg)}
.btn-full{width:100%;min-height:52px;border-radius:15px;background:var(--ink);color:var(--bg);font-size:16px;font-weight:600;text-align:center;margin-top:16px;transition:transform .1s}
.btn-full:disabled{background:var(--fill);color:var(--faint)}
.btn-out{width:100%;min-height:50px;border-radius:15px;border:1px solid var(--line);font-size:15px;font-weight:600;text-align:center;margin-top:10px}
.link{color:var(--muted);font-size:14px;font-weight:500;padding:12px 4px;min-height:44px}
.link.center{display:block;width:100%;text-align:center;text-decoration:underline;text-underline-offset:3px;color:var(--ink2);margin-top:6px}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink2)}
.iconbtn:hover{background:var(--fill)}

.tools{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.seg{display:inline-flex;background:var(--fill);border-radius:10px;padding:2px}
.seg button{padding:6px 13px;border-radius:8px;font-size:13px;font-weight:500;color:var(--muted);min-height:32px}
.seg .on{background:var(--sheet);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* rows (Joi) */
.gh{display:flex;align-items:center;gap:6px;margin:20px 0 0;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);min-height:28px}
.gh svg.i{width:15px;height:15px}
.gh button{display:inline-flex;align-items:center;gap:6px;min-height:44px;text-transform:none;letter-spacing:0;font-size:14px;font-weight:600;color:var(--ink2)}
.row{display:flex;align-items:center;gap:12px;min-height:54px;padding:9px 0;border-bottom:1px dotted var(--line);cursor:pointer}
.row:hover .t{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.row .body{flex:1;min-width:0}
.row .t{font-size:16px;font-weight:500;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
.row .t > span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t svg.i{width:14px;height:14px;color:var(--faint);stroke-width:1.8}
.row .m{font-size:13px;color:var(--muted);margin-top:1px}
.row .tm{font-size:14px;color:var(--muted);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.25}
.row .tm small{display:block;font-size:12px;color:var(--faint)}
.row.done .t{color:var(--faint)}
.row.done .t > span:first-child{text-decoration:line-through;text-decoration-color:var(--faint)}
.ico,.tick{width:24px;height:24px;flex:none;display:grid;place-items:center;color:var(--ink2);position:relative}
.ico.red{color:var(--dot)}
.tick::after{content:"";position:absolute;inset:-12px}
.tick.on{color:var(--faint)}
.tick svg.i{width:21px;height:21px}
.now{display:flex;align-items:center;gap:8px;color:var(--red);font-size:12px;font-weight:600;padding:8px 0;font-variant-numeric:tabular-nums}
.now::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);flex:none}
.now::after{content:"";flex:1;height:1.5px;background:var(--red);opacity:.8}
.gap{display:flex;align-items:center;gap:10px;padding:10px 0;font-size:13px;color:var(--muted);border-bottom:1px dotted var(--line)}
.gap svg.i{width:16px;height:16px;margin-left:4px}
.spdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--h);flex:none}

/* timeline (Structured) */
.tl{position:relative;margin-top:14px}
.tl::before{content:"";position:absolute;left:79px;top:6px;bottom:6px;border-left:2px dotted var(--line)}
.tl-row{display:grid;grid-template-columns:50px 60px 1fr 34px;align-items:center;column-gap:4px;position:relative;cursor:pointer;margin:6px 0}
.tl-time{font-size:12px;color:var(--muted);text-align:right;padding-right:6px;line-height:1.3;font-variant-numeric:tabular-nums;align-self:start;padding-top:4px}
.pill{justify-self:center;width:42px;border-radius:21px;display:grid;place-items:center;color:#fff;background:var(--h);position:relative;z-index:1}
.pill svg.i{width:18px;height:18px;stroke-width:1.9}
.pill.evt{background:color-mix(in oklab,var(--h) 16%,var(--sheet));color:var(--h);box-shadow:inset 0 0 0 2px var(--h)}
.pill.dn{background:var(--fill2);color:var(--faint);box-shadow:none}
.tl-body{padding:0 4px 0 10px;min-width:0}
.tl-body .m{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tl-body .t{font-size:16px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-row.dn .t{color:var(--faint);text-decoration:line-through}
.ring-tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--h);justify-self:center;display:grid;place-items:center;position:relative}
.ring-tick::after{content:"";position:absolute;inset:-12px}
.ring-tick.on{background:var(--h);color:#fff}
.ring-tick svg.i{width:14px;height:14px;stroke-width:2.6}
.tl-gap{display:grid;grid-template-columns:50px 60px 1fr;align-items:center;column-gap:4px;font-size:13px;color:var(--muted);min-height:34px}
.tl-gap span{grid-column:3;padding-left:10px;display:flex;align-items:center;gap:6px}
.tl-gap.nowg span{color:var(--red);font-weight:600}
.tl-gap.nowg::before{content:"";grid-column:1/4;grid-row:1;height:1.5px;background:var(--red);opacity:.7;margin-left:52px}
.tl-gap.nowg span{grid-row:1;position:relative;z-index:1;background:var(--sheet);justify-self:start;padding-right:8px;margin-left:10px;padding-left:0}
.tl-gap.slot button{grid-column:3;justify-self:start;margin-left:10px}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none;z-index:40}
.dock-in{width:min(528px,calc(100% - 28px));display:flex;gap:10px;align-items:center;pointer-events:auto}
.tabs{flex:1;display:flex;justify-content:space-around;background:var(--bar);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);border:1px solid var(--line2);border-radius:999px;padding:5px;box-shadow:var(--shadow)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;font-weight:600;color:var(--muted);padding:6px 10px;border-radius:999px;min-width:58px;min-height:48px;justify-content:center}
.tabs button.on{color:var(--ink);background:var(--fill)}
.tabs .badge{position:absolute;margin:-4px 0 0 18px;background:var(--red);color:var(--badge-ink);font-size:11px;font-weight:600;border-radius:8px;padding:0 5px;line-height:15px}
.fab{width:58px;height:58px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;box-shadow:var(--shadow);flex:none}
.fab svg.i{width:24px;height:24px;stroke-width:2}
.fab:active{transform:scale(.94)}

/* overlays */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;animation:fade .2s}
.bs{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;background:var(--sheet);border-radius:26px 26px 0 0;padding:8px 20px calc(22px + env(safe-area-inset-bottom));z-index:51;box-shadow:var(--shadow);animation:up .3s cubic-bezier(.2,.8,.2,1)}
.modal{position:fixed;left:50%;top:12vh;transform:translateX(-50%);width:640px;max-width:calc(100% - 40px);background:var(--sheet);border-radius:22px;padding:18px 22px 22px;z-index:51;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .2s cubic-bezier(.2,.8,.2,1)}
.grab{width:38px;height:5px;border-radius:3px;background:var(--fill2);margin:0 auto 12px}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
@keyframes pop{from{transform:translateX(-50%) scale(.97);opacity:0}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.bs,.modal,.scrim,.toast{animation-duration:.01s}}
.add-top{display:flex;justify-content:space-between;align-items:center}
.qa{position:relative;margin-top:16px}
.qa .hl,.qa textarea{font:600 23px/1.36 Inter,system-ui,sans-serif;letter-spacing:-.018em;white-space:pre-wrap;overflow-wrap:break-word;width:100%;min-height:64px;padding:0;border:0}
.qa .hl{position:relative;color:var(--ink);pointer-events:none}
.qa textarea{position:absolute;inset:0;height:100%;display:block;overflow:hidden;background:transparent;outline:0;color:transparent;caret-color:var(--ink);resize:none}
.qa textarea::placeholder{color:var(--faint)}
.tok{color:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 11px;border-radius:10px;background:var(--fill);font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap}
.chip svg.i{width:15px;height:15px}
.chip.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.chip.ghost.dash{box-shadow:none;border:1px dashed var(--line)}
.chip.set{background:var(--blue-bg);color:var(--blue)}
.chip.on{background:var(--ink);color:var(--bg)}
.chip.x{padding-right:4px}
.chip.x button{width:26px;height:26px;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin-top:14px;line-height:1.45}
.hint button{color:var(--blue);font-weight:600}

/* task detail */
.screen{background:var(--sheet);min-height:100dvh;padding:calc(env(safe-area-inset-top) + 6px) 20px 120px}
.topbar{display:flex;align-items:center;justify-content:space-between;min-height:52px;gap:10px}
.back{display:inline-flex;align-items:center;gap:2px;font-size:16px;font-weight:500;color:var(--ink2);min-height:44px;padding-right:8px}
.spc{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--ink2);background:var(--fill);border-radius:999px;padding:5px 10px}
.spc i{width:7px;height:7px;border-radius:50%;background:var(--h)}
.t-title{display:flex;gap:12px;align-items:flex-start;margin-top:12px}
.t-title .tick,.t-title .ico{margin-top:4px}
.t-title .tick svg.i{width:26px;height:26px}
.t-title h2{font-size:26px;font-weight:700;letter-spacing:-.025em;line-height:1.2;outline:0;flex:1;text-wrap:balance}
.when{margin-top:18px;padding:12px 0;border-top:1px dotted var(--line);border-bottom:1px dotted var(--line)}
.w1{display:flex;align-items:center;gap:10px;font-size:17px}
.w1 b{font-weight:600}
.w1 .arr{color:var(--muted)}
.w2{font-size:15px;color:var(--ink2);margin:4px 0 0 30px}
.w3{display:flex;gap:16px;margin:8px 0 0 30px;font-size:14px;color:var(--muted)}
.drow{display:flex;align-items:center;gap:10px;min-height:48px;border-bottom:1px dotted var(--line);font-size:15px;width:100%}
.drow > span:nth-child(2){flex:1}
.drow .right{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.drow svg.i{color:var(--ink2)}
.blk{padding:12px 0;border-bottom:1px dotted var(--line)}
.blk-h{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);min-height:28px}
.rem{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px}
.rem span{flex:1}
.rem .iconbtn{width:44px;height:44px;margin:-4px -6px -4px 0;color:var(--muted)}
.addline{display:inline-flex;align-items:center;gap:8px;color:var(--blue);font-weight:600;font-size:15px;min-height:44px}
.menu{background:var(--card);border-radius:14px;padding:6px;margin-top:4px;display:flex;flex-wrap:wrap;gap:6px}
.rep{background:var(--card);border-radius:16px;padding:14px;margin:4px 0 12px}
.rep .lbl{font-size:13px;color:var(--muted);margin:12px 0 6px}
.rep .lbl:first-child{margin-top:0}
.stepper{display:inline-flex;align-items:center;gap:4px;background:var(--fill);border-radius:10px;padding:2px}
.stepper button{width:34px;height:32px;border-radius:8px;font-size:18px;font-weight:500;text-align:center}
.stepper b{min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
.days{display:flex;gap:6px}
.days button{width:36px;height:36px;border-radius:50%;background:var(--fill);font-size:13px;font-weight:600;color:var(--muted);text-align:center}
.days button.on{background:var(--ink);color:var(--bg)}
.switch{width:46px;height:28px;border-radius:14px;background:var(--fill2);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch[aria-checked=true]{background:#30c158}
.switch[aria-checked=true]::after{transform:translateX(18px)}
.togrow{display:flex;align-items:center;gap:12px;min-height:48px;font-size:15px}
.togrow span{flex:1}
.rule{font-size:14px;font-weight:600;margin-top:12px}
.sub-r{display:flex;align-items:center;gap:12px;min-height:44px;font-size:15px}
.circ{width:22px;height:22px;border-radius:50%;border:1.6px solid var(--faint);flex:none;display:grid;place-items:center;position:relative}
.circ::after{content:"";position:absolute;inset:-13px}
.circ.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.circ svg.i{width:13px;height:13px;stroke-width:2.6}
.sub-r.on span{color:var(--faint);text-decoration:line-through}
.sub-in{border:0;background:none;font:inherit;font-size:16px;color:var(--ink);outline:0;flex:1;min-height:44px}
.sub-in::placeholder{color:var(--faint)}
.notes{min-height:96px;font-size:16px;line-height:1.55;outline:0;padding:6px 0;white-space:pre-wrap;color:var(--ink)}
.notes:empty::before{content:attr(data-placeholder);color:var(--faint)}
.goalmini{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:12px 14px;margin-top:6px;width:100%}
.goalmini .t{font-size:15px;font-weight:600}
.goalmini .m{font-size:13px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--fill2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ink);border-radius:3px}
.segbar{display:flex;gap:3px;margin-top:8px}
.segbar i{flex:1;height:6px;border-radius:3px;background:var(--fill2)}
.segbar i.on{background:var(--ink)}
.track{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:14px 0}
.tbar{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));margin:0 auto;width:min(528px,calc(100% - 28px));display:flex;gap:4px;background:var(--bar);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line2);border-radius:999px;padding:5px;box-shadow:var(--shadow);z-index:30}
.tbar button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600;min-height:44px;border-radius:999px;color:var(--ink2)}
.tbar button:hover{background:var(--fill)}
.tbar button.ic{flex:0 0 48px}
.pop{position:fixed;left:0;right:0;margin:0 auto;bottom:calc(80px + env(safe-area-inset-bottom));width:min(528px,calc(100% - 28px));background:var(--sheet);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--shadow);padding:8px;z-index:31}
.pop button{display:flex;width:100%;align-items:center;gap:10px;min-height:44px;padding:0 10px;border-radius:10px;font-size:15px}
.pop button:hover{background:var(--fill)}
.pop button span{margin-left:auto;color:var(--muted);font-size:13px}

/* focus (Tiimo) */
.focus{background:#000;color:#fff;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 8px) 22px 40px;--ink:#fff;--muted:#9a9aa0}
.focus .topbar{width:100%;max-width:520px}
.focus .back{color:#d0d0d5}
.f-title{font-size:24px;font-weight:700;letter-spacing:-.02em;text-align:center;margin-top:10px;text-wrap:balance}
.f-sub{color:#9a9aa0;font-size:15px;margin-top:4px;font-variant-numeric:tabular-nums}
.ringwrap{position:relative;width:280px;height:280px;margin:28px 0 20px}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.f-left{font-size:54px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.f-of{color:#9a9aa0;font-size:14px;margin-top:8px}
.f-ctrl{display:flex;align-items:center;gap:22px}
.f-ctrl .ghost{min-width:84px;min-height:44px;border-radius:999px;background:#1c1c1f;color:#e6e6ea;font-size:14px;font-weight:600;text-align:center}
.f-play{width:76px;height:76px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center}
.f-play svg.i{width:28px;height:28px}
.f-card{width:100%;max-width:420px;background:#141416;border-radius:18px;padding:14px 16px;margin-top:30px}
.f-card .lbl{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#8e8e93}
.f-card .sub-r{color:#f3f3f5}
.f-card .circ{border-color:#6c6c72}
.f-card .after{color:#9a9aa0;font-size:14px;margin-top:8px;padding-top:10px;border-top:1px dotted #38383d}

/* goals */
.tlc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tlc .tlcard:first-child{grid-column:1/-1}
.desk .tlc{grid-template-columns:1.6fr 1fr 1fr}
.desk .tlc .tlcard:first-child{grid-column:auto}
.tlcard{background:var(--card);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tlcard b{font-size:26px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.tlcard span{font-size:13px;color:var(--muted);line-height:1.3}
.weeks{display:flex;flex-wrap:wrap;gap:4px;margin-top:12px}
.weeks i{width:11px;height:11px;border-radius:3px;background:var(--fill2)}
.weeks i.on{background:var(--faint)}
.weeks i.cur{background:var(--dot)}
.goal{padding:16px 0;border-bottom:1px dotted var(--line)}
.goal .t{font-size:17px;font-weight:600;letter-spacing:-.01em}
.goal .why{font-size:14px;color:var(--muted);margin-top:2px}
.goal .row2{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);margin-top:10px;font-variant-numeric:tabular-nums}
.goal .row2 b{color:var(--ink);font-weight:600}
.goal .next{margin-top:8px;font-size:14px;color:var(--ink2)}
.hab{padding:12px 0;border-bottom:1px dotted var(--line)}
.hab-top{display:flex;align-items:center;gap:12px}
.hab-top .t{flex:1;font-size:16px;font-weight:500}
.hab-top .t small{display:block;font-size:13px;color:var(--muted);font-weight:400}
.hab-top .cnt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.dots{display:grid;grid-template-columns:repeat(28,1fr);gap:3px;margin:10px 0 0 36px}
.dots i{aspect-ratio:1;border-radius:50%;background:var(--ink2)}
.dots i.miss{background:transparent;box-shadow:inset 0 0 0 1.3px var(--faint)}
.dots i.off{background:transparent;position:relative}
.dots i.off::after{content:"";position:absolute;left:30%;right:30%;top:50%;height:1.3px;background:var(--line)}
.note{font-size:13px;color:var(--muted);margin-top:12px;line-height:1.45}

/* review */
.datechip{display:inline-block;background:var(--fill);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;margin:10px 0 8px}
.sel-box{width:24px;height:24px;border-radius:50%;border:1.6px solid var(--faint);display:grid;place-items:center;flex:none;position:relative}
.sel-box::after{content:"";position:absolute;inset:-12px}
.sel-box.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.sel-box svg.i{width:14px;height:14px;stroke-width:2.6}
.greet-s{font-size:18px;font-weight:600;line-height:1.4;letter-spacing:-.01em;margin-top:6px}
.greet-s .d{color:var(--muted)}

/* agents */
.prop{background:var(--card);border-radius:18px;padding:14px 16px;margin-top:10px}
.pr-h{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.av{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:12px;font-weight:700;display:grid;place-items:center}
.prop .t{font-size:16px;font-weight:600;margin-top:8px;letter-spacing:-.01em}
.prop .m{font-size:14px;color:var(--muted);margin-top:3px}
.pr-a{display:flex;gap:8px;margin-top:12px;align-items:center}
.prop.done{background:transparent;box-shadow:inset 0 0 0 1px var(--line2)}
.res{font-size:14px;color:var(--ink2);display:inline-flex;gap:6px;align-items:center;flex:1}
.conn{background:var(--card);border-radius:18px;padding:4px 16px}
.conn-r{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dotted var(--line);flex-wrap:wrap}
.conn-r:last-child{border-bottom:0}
.conn-r > div{flex:1;min-width:180px}
.conn-r .t{font-size:15px;font-weight:600}
.conn-r .m{font-size:13px;color:var(--muted)}
code,.term{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:13px}
.conn-r code{background:var(--fill);border-radius:8px;padding:6px 9px}
.term{background:#0d0d0f;color:#e8e8ec;border-radius:16px;padding:14px 16px;margin-top:12px;white-space:pre-wrap;line-height:1.6;overflow-x:auto}
.term .mut{color:#8e8e93}
.act{display:flex;gap:12px;font-size:14px;padding:10px 0;border-bottom:1px dotted var(--line)}
.act .tm{color:var(--muted);font-variant-numeric:tabular-nums;min-width:96px}

/* week (phone tray) */
.tray-r{display:flex;align-items:center;gap:12px;min-height:56px;border-bottom:1px dotted var(--line)}
.tray-r .body{flex:1;min-width:0}
.tray-r .t{font-size:16px;font-weight:500}
.tray-r .m{font-size:13px;color:var(--muted)}
.placing{background:var(--card);border-radius:16px;padding:12px 14px;margin:8px 0}
.placing p{font-size:14px;margin-bottom:8px}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));background:#1c1c1f;color:#fff;border-radius:999px;padding:6px 6px 6px 18px;display:flex;align-items:center;gap:12px;font-size:14px;font-weight:500;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:calc(100% - 28px);animation:fade .2s}
.toast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast button{background:#fff;color:#000;border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;min-height:34px}
.toast.solo{padding:10px 18px}

/* ---------- Desktop ---------- */
.desk{display:grid;grid-template-columns:248px minmax(0,1fr);height:100vh;overflow:hidden}
.side{background:var(--side);border-right:1px solid var(--line2);padding:18px 14px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.brand{font-size:20px;font-weight:700;letter-spacing:-.03em;padding:2px 8px 12px;display:flex;align-items:center}
.brand i{width:6px;height:6px;border-radius:50%;background:var(--dot);margin-left:3px;align-self:flex-start;margin-top:6px}
.newbtn{display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);border-radius:12px;padding:0 12px;min-height:40px;font-size:14px;font-weight:600;margin-bottom:14px}
.newbtn kbd{margin-left:auto;font:600 11px Inter,sans-serif;opacity:.6;border:1px solid currentColor;border-radius:5px;padding:0 5px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.tile{background:var(--sheet);border:1px solid var(--line2);border-radius:14px;padding:10px 11px;display:flex;flex-direction:column;gap:4px;min-height:70px}
.tile .top{display:flex;justify-content:space-between;align-items:center}
.tile .top i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--fill)}
.tile .top i svg.i{width:15px;height:15px}
.tile b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;font-weight:600;color:var(--muted)}
.tile.on{border-color:var(--ink)}
.nav{display:flex;align-items:center;gap:10px;min-height:38px;padding:0 10px;border-radius:10px;font-size:14px;font-weight:500;color:var(--ink2);width:100%}
.nav:hover{background:var(--fill)}
.nav.on{background:var(--fill2);color:var(--ink);font-weight:600}
.nav svg.i{width:18px;height:18px}
.nav .cnt{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav .cnt.red{color:var(--badge-ink);background:var(--red);font-weight:600;border-radius:8px;padding:0 6px;line-height:17px}
.side .h2{margin:18px 10px 4px}
.sp{display:flex;align-items:center;gap:10px;min-height:32px;padding:0 10px;font-size:14px;color:var(--ink2)}
.sp.child{padding-left:28px}
.side-foot{margin-top:auto;padding:12px 10px 0;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.main{overflow:auto;height:100vh;position:relative}
.main.dark{background:#000}
.td{display:grid;grid-template-columns:minmax(0,1fr) 400px;height:100vh}
.col{overflow:auto;padding:28px clamp(24px,4vw,56px) 80px}
.col-in{max-width:680px;margin:0 auto}
.sheet-d{padding:18px 4px 0}
.rp{border-left:1px solid var(--line2);overflow:auto;background:var(--sheet);position:relative}
.rp .screen{min-height:100%;padding:12px 24px 96px}
.rp .tbar,.rp .pop{position:sticky;width:auto;margin:16px 0 0}
.rp .pop{bottom:auto;margin-top:8px}
.daycal{padding:20px 20px 0}
.daycal h3{font-size:20px;font-weight:700;letter-spacing:-.02em}
.allday{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;background:var(--card);border-radius:8px;padding:6px 10px;margin:10px 0 6px}
.allday svg.i{width:14px;height:14px;color:var(--dot)}
.cal{position:relative;margin-top:8px}
.hr{height:var(--hpx);border-top:1px solid var(--line2);position:relative}
.hr span{position:absolute;top:-8px;left:0;font-size:11px;color:var(--muted);background:var(--sheet);padding-right:6px;font-variant-numeric:tabular-nums}
.ev{position:absolute;left:48px;right:6px;border-radius:7px;padding:4px 8px 4px 10px;font-size:12px;line-height:1.3;overflow:hidden;cursor:pointer;background:color-mix(in oklab,var(--h) 15%,var(--sheet));color:color-mix(in oklab,var(--h) 55%,var(--ink));border-left:3px solid var(--h)}
.ev b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.task{background:color-mix(in oklab,var(--h) 8%,var(--sheet));border-left-style:solid}
.ev.dn{opacity:1;background:var(--fill)}
.ev.dn b{text-decoration:line-through;color:var(--muted)}
.ev.pt{height:22px !important;background:transparent;border:1px dashed var(--h);border-left-width:3px;border-left-style:solid}
.ev:hover{filter:brightness(.97)}
.calnow{position:absolute;left:40px;right:0;height:2px;background:var(--red);z-index:3}
.calnow::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.cal-up{position:sticky;bottom:0;padding:12px 16px 16px;background:linear-gradient(transparent,var(--sheet) 22%)}
.cal-up .up{margin-top:0;box-shadow:var(--shadow);background:var(--sheet);border:1px solid var(--line2)}
.dpg{max-width:760px;margin:0 auto;padding:36px 40px 80px}
.dpg.wide{max-width:1120px}
.g-cols{display:grid;grid-template-columns:1fr;gap:0 48px}
.desk .g-cols{grid-template-columns:1.1fr 1fr}
.wkd{display:grid;grid-template-columns:260px minmax(0,1fr);height:100vh}
.wk-inbox{border-right:1px solid var(--line2);padding:24px 16px;overflow:auto}
.wk-inbox .h2{margin-top:0}
.ib{display:flex;gap:10px;align-items:flex-start;background:var(--sheet);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;margin-top:8px;cursor:grab;font-size:14px}
.ib:active{cursor:grabbing}
.ib .spdot{margin-top:6px}
.ib .t{font-weight:600;line-height:1.3}
.ib .m{font-size:12px;color:var(--muted);margin-top:2px}
.wk-main{display:flex;flex-direction:column;min-width:0;height:100vh}
.wk-top{display:flex;align-items:baseline;justify-content:space-between;padding:22px 24px 10px}
.wk-head{display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line2);padding:0 0 8px}
.wk-head div{text-align:center;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.wk-head div b{display:block;font-size:20px;color:var(--ink);letter-spacing:-.02em;text-transform:none;font-variant-numeric:tabular-nums}
.wk-head .today{color:var(--red)}
.wk-head .today b{color:var(--red)}
.wk-scroll{overflow:auto;flex:1}
.wk-grid{display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr));position:relative;padding-top:10px}
.wk-times div{height:var(--hpx);font-size:11px;color:var(--muted);text-align:right;padding-right:8px;transform:translateY(-7px);font-variant-numeric:tabular-nums}
.wcol{position:relative;border-left:1px solid var(--line2);height:calc(var(--hpx) * 15);background-image:repeating-linear-gradient(to bottom,var(--line2) 0 1px,transparent 1px var(--hpx))}
.wcol.today{background-color:color-mix(in oklab,var(--dot) 3%,transparent)}
.wcol .ev{left:3px;right:3px}
.wcol .calnow{left:0}
.ghostb{position:absolute;left:3px;right:3px;border-radius:7px;border:1.5px dashed var(--blue);background:var(--blue-bg);color:var(--blue);font-size:12px;font-weight:600;padding:3px 8px;pointer-events:none;z-index:4}

@media (min-width:700px) and (max-width:899px){.phone{box-shadow:0 0 0 1px var(--line2)}}

/* Tap targets reach 44px without changing how controls look (Critly: Hit Areas). */
.btn-sm,.chip,.seg button{position:relative}
.btn-sm::after,.chip::after,.seg button::after{content:"";position:absolute;inset:-6px -6px}
.switch::before{content:"";position:absolute;inset:-8px -2px}

/* ---------- B2 ---------- */
html,body{overscroll-behavior-y:contain}
.tick.popin svg.i,.ring-tick.popin svg.i{animation:popin .38s cubic-bezier(.3,1.7,.5,1)}
@keyframes popin{0%{transform:scale(.4)}100%{transform:scale(1)}}
@keyframes pop2{from{transform:scale(.96);opacity:0}}

/* rows: swipe and long press */
.sw{position:relative;overflow:hidden}
.sw > .row{background:var(--sheet);position:relative;z-index:1;touch-action:pan-y;will-change:transform}
.sw-bg{position:absolute;inset:0;display:none;align-items:center;gap:8px}
.sw.dir-r .sw-bg.r,.sw.dir-l .sw-bg.l{display:flex}
.sw-bg.r{background:#1b7a3c;color:#fff;padding-left:6px}
.sw-bg.l{justify-content:flex-end;padding-right:4px;background:var(--fill)}
.sw-btn{min-height:44px;min-width:84px;border-radius:12px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;background:var(--ink);color:var(--bg)}
.sw-btn.q{background:var(--sheet);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.sw-btn.ok{background:transparent;color:#fff}
.sw-btn svg.i{width:18px;height:18px;transition:transform .15s}
.sw.armed .sw-bg.r svg.i{transform:scale(1.35)}
.sw.armed.dir-l .sw-btn.q{display:none}
.sw.armed.dir-l .sw-btn{min-width:120px}
.row.pressing{transform:scale(.975);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.row.held{background:var(--card);border-radius:12px;padding-left:8px;padding-right:8px}
.lpmenu{background:var(--sheet);border:1px solid var(--line2);border-radius:16px;box-shadow:var(--shadow);padding:6px;margin:4px 0 10px;animation:pop2 .18s cubic-bezier(.2,.8,.2,1);transform-origin:top center}
.lpmenu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 10px;border-radius:10px;font-size:15px}
.lpmenu button:hover{background:var(--fill)}
.lpmenu .dng{color:var(--red)}

/* free gaps with a twin for double tap */
.gap{min-height:46px;padding:4px 0}
.gap .gadd,.tl-gap .gadd{margin-left:auto}
.tl-gap span{flex:1}
.autonote{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;font-size:14px;color:var(--ink2);border-bottom:1px dotted var(--line);padding:8px 0;text-align:left}
.autonote svg.i{width:16px;height:16px;color:var(--muted)}
.autonote span{flex:1}
.autonote b{font-weight:600;color:var(--ink)}
.src{display:inline-block;font-size:12px;font-weight:600;color:var(--muted);background:var(--fill);border-radius:6px;padding:0 6px;margin-left:4px;line-height:18px}
.rvc{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:10px 12px 10px 14px;margin:8px 0}
.rvc .body{flex:1;min-width:0}
.rvc .t{font-size:16px;font-weight:600}
.rvc .m{font-size:13px;color:var(--muted)}
.tl-rv{padding-left:114px}

/* haptic label, pull indicator */
.hchip{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#1c1c1f;color:#fff;font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px;z-index:70;pointer-events:none;animation:fade .15s;font-variant-numeric:tabular-nums}
.pullind{position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;z-index:45;background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;border-radius:999px;padding:6px 12px;pointer-events:none;display:flex;align-items:center;gap:6px}
.pullind svg.i{width:15px;height:15px}

/* task sheet */
.tsheet{position:fixed;left:0;right:0;margin:0 auto;max-width:560px;bottom:0;height:94dvh;background:var(--sheet);border-radius:24px 24px 0 0;z-index:51;box-shadow:0 -10px 40px rgba(0,0,0,.18);display:flex;flex-direction:column;will-change:transform}
.tsh-head{touch-action:none;padding:0 14px 0 20px;flex:none}
.tsh-grab{display:block;margin:0 auto;width:96px;height:28px;position:relative}
.tsh-grab::before{content:"";position:absolute;left:50%;top:10px;width:38px;height:5px;margin-left:-19px;border-radius:3px;background:var(--fill2)}
.tsh-grab::after{content:"";position:absolute;inset:-8px 0}

  // ---------- why notes (each shown once per render) ----------
  const WHY = {
    day: "Joi (App Store) | The weekday is the anchor, set big with a red dot. You know where you are in the week before you read anything else.",
    greet: "Joi (App Store) | One sentence instead of a dashboard: counts with glyphs, then when you're free. Research: a concrete plan quiets the nagging thoughts unfinished goals cause (Masicampo & Baumeister 2011).",

  const scr = P.get("screen") === "agents" ? "assistant" : P.get("screen");
  if (scr === "task") S.openTask = "lab";
  else if (scr === "add") S.add = { open: true, text: "Gym tomorrow 7am for 45m every Mon Wed Fri remind 10m before #health", kind: "task", fresh: false };

  if (scr === "focus") S.focus.running = true;

  const getAny = (id) => S.items.find((i) => i.id === id) || S.week.find((i) => i.id === id) || S.inbox.find((i) => i.id === id);
  const isToday = (it) => S.items.includes(it);
  const dayItems = (o) => (o === 0 ? S.items : S.week.filter((w) => w.day === o));
  const timedOf = (its) => its.filter((i) => i.start && !i.allDay && !i.anytime).sort((a, b) => a.start - b.start);
  const endOf = (i) => i.end || (i.duration && i.start ? new Date(i.start.getTime() + i.duration * 60000) : null);

  function counts(its) {
    return {
      ev: its.filter((i) => i.kind === "event" && !i.allDay).length,
      tasks: its.filter((i) => i.kind === "task" && !i.habit && !i.done && !i.from).length,
      habits: its.filter((i) => i.habit && !i.done).length,
    };
  }
  function freeAfter(its) {
    let last = null;
    for (const i of its) { if (i.allDay || i.anytime || i.habit || !i.start) continue; const e = endOf(i) || i.start; if (!last || e > last) last = e; }
    if (!last) return null;
    const d = new Date(last);
    if (d.getMinutes()) d.setHours(d.getHours() + 1, 0);
    return K.fmtTime(d);
  }
  function plannedLeft() {
    let p = 0;
    for (const i of S.items) {
      if (!i.start || i.allDay || i.anytime || i.done || !i.duration) continue;

  }
  const daysLeft = (d) => Math.ceil((startOfDay(d) - startOfDay(NOW)) / K.DAY);

  // ---------- undo + toast ----------
  function snap() { return structuredClone({ items: S.items, week: S.week, inbox: S.inbox, habits: S.habits, runs: S.runs, rv: S.rv }); }

  function headHTML(o, cls = "") {

  function nextUp() { return timedOf(S.items).find((i) => i.start > NOW && !i.done); }

  function listHTML(o) {

        if (prevEnd && prevEnd < rvDate) { const g = K.minutesBetween(prevEnd, rvDate); if (g >= 30) flat.push({ part: "Evening", html: gapHTML(prevEnd, g) }); prevEnd = rvDate; }
        flat.push({ part: "Evening", html: reviewCard() }); rvDone = true;
      }
      if (prevEnd && (o !== 0 || it.start > NOW)) {
        const g = K.minutesBetween(prevEnd, it.start);
        if (g >= 30) flat.push({ part, html: gapHTML(prevEnd, g) });
      }
      flat.push({ part, html: rowHTML(it) });
      const e = endOf(it) || it.start;
      if (!prevEnd || e > prevEnd) prevEnd = e;
    }
    if (!nowDone) flat.push({ part: "Evening", html: `<div class="now">${K.fmtTime(NOW)}</div>` });
    if (!rvDone) flat.push({ part: "Evening", html: reviewCard() });
    const icons = { Morning: "sun", Afternoon: "sunset", Evening: "moon" };
    let cur = null;
    for (const f of flat) {
      if (f.part !== cur) {
        cur = f.part;
        const n = t.filter((i) => partOf(i.start) === cur).length;
        h += `<div class="gh"${W("parts")}>${ic(icons[cur])}${cur} (${n})</div>`;
      }

    }
    if (!its.length) h += `<p class="note">Nothing here yet. Add a task with the + button, or drag one in from the week.</p>`;
    return h;
  }

  function pillHTML(it) {
    const dur = it.duration;

    const icon = it.kind === "event" ? "cal" : it.habit ? "loop" : SPACE_ICON[it.space] || "box";
    return `<div class="pill ${it.kind === "event" ? "evt" : ""} ${it.done ? "dn" : ""}" style="height:${hgt}px">${ic(it.done ? "check" : icon)}</div>`;
  }
  function timelineHTML(o, opts = {}) {
    const t = timedOf(dayItems(o));

    let prevEnd = null, nowDone = o !== 0, rvDone = o !== 0 || opts.place;
    const rvMin = toMin(S.set.review);
    const slots = opts.place && S.placing ? freeSlots(o, (S.inbox.find((i) => i.id === S.placing) || {}).duration) : [];
    for (const it of t) {
      if (!nowDone && it.start > NOW) {
        const m = K.minutesBetween(NOW, it.start);

    if (slots.length) h += `<div class="tl-gap slot"><span>Free slots: ${slots.map((m) => `<button class="btn-sm dark" data-act="place-at" data-min="${m}">${fmtMin(m)}</button>`).join(" ")}</span></div>`;
    return h + "</div>";
  }

  function freeSlots(o, dur) {
    const busy = timedOf(dayItems(o)).map((i) => [i.start.getHours() * 60 + i.start.getMinutes(), ((endOf(i) || new Date(i.start.getTime() + 1800000)).getHours() * 60 + (endOf(i) || new Date(i.start.getTime() + 1800000)).getMinutes())]);
    const need = dur || 30;
    const from = o === 0 ? Math.ceil((NOW.getHours() * 60 + NOW.getMinutes()) / 30) * 30 : 8 * 60;
    const out = [];
    for (let m = from; m + need <= 21 * 60 && out.length < 4; m += 30) {
      if (!busy.some(([a, b]) => m < b && m + need > a)) { out.push(m); m += need - 30 + 30; }

    return out;
  }

  // ---------- quick add ----------
  const EXAMPLE = "Gym tomorrow 7am for 45m every Mon Wed Fri remind 10m before #health";
  function hlHTML(text, p) {

  function dateWord(d) { const o = dayOffset(d); return o === 0 ? "Today" : o === 1 ? "Tomorrow" : K.fmtDate(d); }
  function chipsHTML(p) {

  // ---------- task (v2: a sheet with a line of chips) ----------
  const DUR = [null, 5, 15, 30, 45, 60, 90, 120, 180];

  function rrOf(it) {

  }
  function whenLabel(it) {
    const e = endOf(it);
    if (it.allDay) return `${K.fmtDate(it.start)}, all day`;
    if (it.start && !it.anytime) { const o = dayOffset(it.start); const d = o === 0 ? K.WEEKDAYS[it.start.getDay()] : K.fmtDate(it.start); return `${d} ${K.fmtTime(it.start)}${e ? ` → ${K.fmtTime(e)}` : ""}`; }
    if (S.inbox.includes(it)) return null;

  }

  }
  function taskBody(it, where) {

  const sheetH = () => Math.round(innerHeight * 0.94);

  // ---------- focus ----------
  function focusInner() {
    const it = getAny(S.focus.id);
    if (!it) return "";
    const total = it.duration ? it.duration * 60 + S.focus.extra : null;
    const C = 2 * Math.PI * 126;
    const p = total ? Math.min(1, S.focus.elapsed / total) : 0;
    const e = endOf(it);
    const nextStep = (it.subtasks || []).findIndex((s) => !s.done);
    const after = timedOf(S.items).find((i) => it.start && i.start > it.start && i.id !== it.id && !i.done);
    const angle = p * 2 * Math.PI;
    const dx = 140 + 126 * Math.cos(angle), dy = 140 + 126 * Math.sin(angle);
    return `<div class="focus"><div class="topbar"><button class="back" data-act="focus-close">${ic("chevL")}Today</button><span class="mut" style="font-size:14px;font-weight:600">Focus</span></div>
      <h1 class="f-title">${esc(it.title)}</h1><p class="f-sub">${it.start && e ? `${K.fmtTime(it.start)} → ${K.fmtTime(e)} · ${K.fmtDur(it.duration)}` : "No length set, counting up"}</p>
      <div class="ringwrap"${W("ring")}><svg viewBox="0 0 280 280" aria-hidden="true"><circle cx="140" cy="140" r="126" fill="none" stroke="#232326" stroke-width="14"/><circle id="f-arc" cx="140" cy="140" r="126" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - p)}"/><circle id="f-dot" cx="${dx}" cy="${dy}" r="6" fill="#ff453a"/></svg>
        <div class="ringc"><div class="f-left" id="f-left" role="timer" aria-live="off">${total ? fmtHMS(total - S.focus.elapsed) : fmtHMS(S.focus.elapsed)}</div><div class="f-of">${total ? `left of ${K.fmtDur(Math.round(total / 60))}` : "focused"}</div></div></div>
      <div class="f-ctrl"><button class="ghost" data-act="focus-plus">+5 min</button><button class="f-play" data-act="focus-toggle" aria-label="${S.focus.running ? "Pause" : "Start"}">${ic(S.focus.running ? "pause" : "play")}</button><button class="ghost" data-act="focus-done">Done</button></div>
      <div class="f-card">${nextStep >= 0 ? `<div class="lbl">Next step</div><div class="sub-r"><button class="circ" data-act="focus-step" data-v="${nextStep}" aria-label="Tick off step">${""}</button><span>${esc(it.subtasks[nextStep].title)}</span></div>` : `<div class="lbl">Next step</div><p style="font-size:15px;margin-top:6px">${it.subtasks ? "All steps done" : "Just this task"}</p>`}${after ? `<p class="after">After this: ${esc(after.title)} at ${K.fmtTime(after.start)}</p>` : ""}</div></div>`;
  }
  function updateFocus() {
    const it = getAny(S.focus.id); if (!it) return;
    const total = it.duration ? it.duration * 60 + S.focus.extra : null;
    const el = document.getElementById("f-left"); if (!el) return;
    el.textContent = total ? fmtHMS(total - S.focus.elapsed) : fmtHMS(S.focus.elapsed);
    if (total) {
      const C = 2 * Math.PI * 126, p = Math.min(1, S.focus.elapsed / total);
      document.getElementById("f-arc").setAttribute("stroke-dashoffset", C * (1 - p));
      const a = p * 2 * Math.PI, dot = document.getElementById("f-dot");
      dot.setAttribute("cx", 140 + 126 * Math.cos(a)); dot.setAttribute("cy", 140 + 126 * Math.sin(a));
    }
  }
  setInterval(() => {
    if (S.screen !== "focus" || !S.focus.running) return;
    S.focus.elapsed += 1;
    const it = getAny(S.focus.id); if (it) it.tracked = (it.tracked || 0) + 1 / 60;
    updateFocus();
  }, 1000);

  // ---------- goals and habits ----------
  function goalsHTML() {
    const yf = K.timeLeft.yearFraction;
    const wkNow = Math.floor(yf * 52);
    const weeks = Array.from({ length: 52 }, (_, i) => `<i class="${i < wkNow ? "on" : i === wkNow ? "cur" : ""}"></i>`).join("");
    const sem = Array.from({ length: 13 }, (_, i) => `<i class="${i < 9 ? "on" : i === 9 ? "cur" : ""}"></i>`).join("");
    let h = `<div class="pg-head"><h1 class="h1">Goals and habits</h1><p class="sub">What you're working towards, and the time you still have.</p></div>`;
    h += `<div class="tlc"${W("timeleft")}><div class="tlcard"><b>${K.timeLeft.yearDaysLeft}</b><span>days left in 2026</span><div class="weeks" aria-hidden="true">${weeks}</div></div><div class="tlcard"><b>${K.timeLeft.semesterWeeksLeft} wks</b><span>left in the semester</span><div class="weeks" aria-hidden="true">${sem}</div></div><div class="tlcard"><b>${K.timeLeft.weekFreeHours}h</b><span>free this week, Thu to Sun</span><button class="btn-sm" style="margin-top:auto;align-self:flex-start" data-act="nav" data-to="week">Plan it</button></div></div>`;

        const d = x.milestones.filter((m) => m.done).length, left = x.milestones.length - d;

        if (x.hoursPlannedThisWeek) prog += `<div class="row2"><span>This week: <b>${x.hoursDoneThisWeek}h</b> of ${x.hoursPlannedThisWeek}h planned</span></div><div class="bar"><i style="width:${(x.hoursDoneThisWeek / x.hoursPlannedThisWeek) * 100}%"></i></div>`;
      } else if (x.metric) {

      }

    });
    let hb = `<h2 class="h2">Habits today <span>${S.habits.filter((x) => x.todayDone).length} of ${S.habits.length}</span></h2><div${W("habits")}>`;

    }

  }

  // ---------- review (v2: a short ritual) ----------
  const FACES = [["Rough", "M8.2 16.6c1-1.5 2.3-2.2 3.8-2.2s2.8.7 3.8 2.2"], ["Meh", "M8.6 15.4h6.8"], ["Okay", "M8.6 14.8c1 .7 2.1 1.1 3.4 1.1s2.4-.4 3.4-1.1"], ["Good", "M8.2 14.2c1 1.6 2.3 2.4 3.8 2.4s2.8-.8 3.8-2.4"], ["Great", "M7.8 13.4h8.4c0 2.5-1.9 4.4-4.2 4.4s-4.2-1.9-4.2-4.4z"]];
  const faceSvg = (p) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="9" cy="10" r=".9" fill="currentColor"/><circle cx="15" cy="10" r=".9" fill="currentColor"/><path d="${p}"/></svg>`;
  const rvOpen = () => S.items.filter((i) => i.kind === "task" && !i.done && !i.habit);
  function stretches(o, from, to) {
    const t = timedOf(dayItems(o)).filter((i) => !i.done);
    let cur = from; const out = [];
    for (const i of t) { const a = minOf(i.start), e = endOf(i), b = e ? minOf(e) : a + 15; if (b <= cur) continue; if (a - cur >= 30) out.push([cur, a]); cur = Math.max(cur, b); }
    if (to - cur >= 30) out.push([cur, to]);
    return out;
  }
  function fitTomorrow(id) {
    const it = S.week.find((w) => w.id === id && w.day === 1); if (!it || !it.start || it.anytime) return;
    const span = (x) => { const a = minOf(x.start), e = endOf(x); return [a, e ? minOf(e) : a + 15]; };
    const others = timedOf(S.week.filter((w) => w.day === 1 && w !== it));
    const dur = it.duration || 30, s0 = minOf(it.start);
    const clash = others.find((x) => { const [a, b] = span(x); return s0 < b && s0 + dur > a; });
    if (!clash) return;
    const cb = span(clash)[1];
    let m = Math.ceil((cb + 60) / 60) * 60;
    while (m + dur <= 22 * 60 && others.some((x) => { const [a, b] = span(x); return m < b && m + dur > a; })) m += 30;
    it.start = K.atDay(1, Math.floor(m / 60), m % 60); it.end = it.duration ? new Date(it.start.getTime() + it.duration * 60000) : null;
    S.rv.note = `Tomorrow is full until ${fmtMin(cb)} (${clash.title}), so I put "${it.title}" at ${fmtMin(m)}.`;
  }
  function rvDecide(id, v) {
    const it = getAny(id); if (!it) return;
    const msg = v === "letgo" ? (it.repeat ? `Skipped today's "${it.title}"` : `Let go of "${it.title}"`) : v === "inbox" ? `Moved "${it.title}" to the inbox` : `Moved "${it.title}" to ${K.fmtDate(K.atDay(+v))}`;
    haptic(v === "letgo" ? "light" : "success"); sound(v === "letgo" ? "swoosh" : "tick");
    commit(msg, () => {
      if (v === "letgo") S.items = S.items.filter((x) => x !== it);
      else if (v === "inbox") moveItem(it, "inbox");
      else { moveItem(it, +v); if (+v === 1) fitTomorrow(id); }
      S.rv.picking = false;
    });
  }
  function reviewHTML() {
    const R = S.rv;
    if (!R.queue) R.queue = rvOpen().map((i) => i.id);
    let h = `<span class="datechip">${K.fmtDate(NOW)}</span><div class="rv-steps" aria-hidden="true">${[0, 1, 2, 3].map((s) => `<i class="${s <= Math.min(R.step, 3) ? "on" : ""}"></i>`).join("")}</div>`;
    if (R.step === 0) {
      const done = S.items.filter((i) => i.done && !(i.habit && i.anytime)), hab = S.items.filter((i) => i.done && i.habit && i.anytime);
      const focused = Math.round(S.items.reduce((a, i) => a + (i.tracked || 0), 0));
      const open = rvOpen().length;
      h += `<h1 class="rv-big"${W("rvdone")}><span class="d">Today you finished</span> ${plural(done.length, "task")}${hab.length ? ` <span class="d">and</span> ${plural(hab.length, "habit")}` : ""}<span class="d">, and focused for</span> ${K.fmtDur(focused) || "0m"}<span class="d">.</span></h1>`;
      h += `<h2 class="h2">Done</h2>${[...done, ...hab].map((i) => `<div class="rvd">${ic(i.habit && i.anytime ? "habitOn" : "boxOn")}<span>${esc(i.title)}</span><span class="mut tnum">${i.tracked ? K.fmtDur(Math.round(i.tracked)) : ""}</span></div>`).join("") || `<p class="note">Nothing ticked off today. That happens; tomorrow is a fresh start.</p>`}`;
      h += `<button class="btn-full" data-act="rv-next">${open ? `Next: ${plural(open, "thing")} still open` : "Next: tomorrow"}</button>`;
    } else if (R.step === 1) {
      const q = R.queue.map(getAny).filter((i) => i && S.items.includes(i) && !i.done && !R.kept.includes(i.id));
      if (!q.length) { R.step = 2; return reviewHTML(); }
      const it = q[0], total = R.queue.length, pos = Math.min(total, total - q.length + 1);
      const meta = [];
      if (it.start && !it.anytime) meta.push(`${K.fmtTime(it.start)}${endOf(it) ? ` → ${K.fmtTime(endOf(it))}` : ""}`);
      if (it.from) meta.push(`From ${K.fmtDate(it.from)}`);
      if (it.duration) meta.push(K.fmtDur(it.duration));
      if (it.repeat) meta.push("Repeats: only today's moves");
      if (it.source) meta.push(`From ${it.source}`);
      h += `<h1 class="h1">Still open</h1><p class="sub tnum">${pos} of ${total}. Give each one a place, or let it go.</p>`;
      h += `<div class="rv-stack"${W("rvcard")}>${q[1] ? `<div class="rv-card under" aria-hidden="true"></div>` : ""}<div class="rv-card" id="rv-card" data-id="${it.id}"><span class="rv-lab r">Tomorrow</span><span class="rv-lab l">Let it go</span><div class="m">${esc(meta.join(" · ") || K.spacePath(it.space))}</div><div class="t">${esc(it.title)}</div><div class="rv-hint"><span>${ic("chevL")}Let it go</span><span>Tomorrow${ic("chevR")}</span></div></div></div>`;
      h += `<div class="rv-acts"><button class="pri" data-act="rv-dec" data-v="1" data-id="${it.id}">${ic("arrowR")}Tomorrow</button><button data-act="rv-pick" aria-expanded="${R.picking}">${ic("cal")}Pick a day</button><button data-act="rv-dec" data-v="inbox" data-id="${it.id}">${ic("inbox")}Inbox</button><button data-act="rv-dec" data-v="letgo" data-id="${it.id}">${ic("x")}Let it go</button></div>`;
      if (R.picking) h += `<div class="chips">${[[2, "Sat 24 Oct"], [3, "Sun 25 Oct"], [4, "Mon 26 Oct"], [7, "Thu 29 Oct"]].map(([v, l]) => `<button class="chip ghost" data-act="rv-dec" data-v="${v}" data-id="${it.id}">${l}</button>`).join("")}</div>`;

      h += `<h1 class="h1">Tomorrow</h1><p class="sub">${K.fmtDate(K.atDay(1))}</p><p class="greet-s"><span class="d">You have</span> ${joinAnd(parts) || "nothing planned yet"}<span class="d">.</span></p>`;
      h += `<div class="rv-note"${W("rvtomorrow")}>${ic("spark")}<span>${esc(note)}</span></div>`;
      h += timedOf(tm).slice(0, 5).map((i) => `<div class="rvd">${ic(i.kind === "event" ? "cal" : "box")}<span>${esc(i.title)}</span><span class="mut tnum">${K.fmtTime(i.start)}</span></div>`).join("");
      const any = tm.filter((i) => i.anytime).length;

    }
    return h;
  }

  // ---------- assistant ----------

    { id: "c1", title: "Lab reports take longer than you plan", text: "Your last three took 1h 50m on average; you planned 1h 30m each time. Lab report 4 is due tomorrow at 17:00.", action: "Plan lab reports at 1h 50m", done: "New lab reports will start at 1h 50m" },

  }
  function slotFrom(from, dur, taken = []) {
    const busy = timedOf(S.items).filter((i) => !i.done).map((i) => { const a = minOf(i.start), e = endOf(i); return [a, e ? minOf(e) : a + 15]; }).concat(taken);

  function cardHTML(c) {

  function msgHTML(m, idx) {

    let h = `<div class="msg k"${idx === S.chat.length - 1 ? W("cards") : ""}><p class="bub">${esc(m.text)}</p>${(m.cards || []).map(cardHTML).join("")}`;

  }
  const spanTxt = (i) => `${K.fmtTime(i.start)}${endOf(i) ? ` → ${K.fmtTime(endOf(i))}` : ""}`;
  function uniMinutes() {
    const uni = (sp) => ["uni", "comp2310", "thesis"].includes(sp);
    return [-3, -2, -1, 0, 1, 2, 3].map((o) => {
      let m = 0;
      for (const i of dayItems(o)) {
        if (!uni(i.space) || !i.start || i.anytime || i.allDay) continue;
        const e = endOf(i); if (!e) continue;
        const past = o < 0 || (o === 0 && e <= NOW);
        if (past && (i.kind === "event" || i.done)) m += K.minutesBetween(i.start, e);

  }
  function respond(q) {
    const t = q.toLowerCase();
    if (/plan (my|the) (day|afternoon|evening)|^plan( my)? day/.test(t)) return planDay();
    if (/time for|free time|what can i (do|fit)|how much time/.test(t)) return timeFor();
    if (/(lab|report)/.test(t) && /after lunch|afternoon|later/.test(t)) return moveLab();
    if (/(left|rest|unfinished|everything).*tomorrow/.test(t)) return leftTomorrow();
    if (/stud(y|ied)|\buni\b|university/.test(t)) return study();
    if (/week go|this week|how did/.test(t)) return weekGo();
    const bare = q.replace(/^(please\s+)?(add|create|remind me to|remind me)\s+/i, "");
    const p = K.parseQuickAdd(bare);
    const dm = bare.match(/\b(\d{1,2})\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\b/i);
    if (dm) { const d = new Date(2026, K.MONTHS.findIndex((m) => m.toLowerCase() === dm[2].slice(0, 3).toLowerCase()), +dm[1]); if (d < K.atDay(0)) d.setFullYear(2027); p.date = d; }
    if (/^(please\s+)?(add|create|remind me)/i.test(q) || p.date || p.time) return addTask(p);
    return { text: "I can add things, move them, find free time and tell you how your week is going. Try one of the suggestions below." };
  }
  function planDay() {
    const email = S.items.find((i) => i.id === "email"), rent = S.items.find((i) => i.id === "rent"), bike = S.inbox.find((i) => i.id === "i2");
    const quick = [email, rent].filter((i) => i && i.anytime && !i.done);
    if (!quick.length && !bike) return { text: "Your day already has a place for everything. You're free after 18:45." };
    const bits = []; if (quick.length) bits.push("the quick ones right after lunch"); if (bike) bits.push("the bike brake after design crit");
    return {
      text: `I used the gaps: ${bits.join(" and ")}. Everything else stays where it was, and tonight from 18:45 is still free.`,
      change: () => {
        const e = S.items.find((i) => i.id === "email"); if (e && e.anytime && !e.done) { e.anytime = false; e.start = K.atDay(0, 13, 30); e.end = K.atDay(0, 13, 45); }
        const r = S.items.find((i) => i.id === "rent"); if (r && r.anytime && !r.done) { r.anytime = false; r.start = K.atDay(0, 13, 45); r.end = K.atDay(0, 13, 50); }
        const b = S.inbox.find((i) => i.id === "i2"); if (b) { S.inbox = S.inbox.filter((i) => i !== b); S.items.push({ ...b, kind: "task", start: K.atDay(0, 18, 0), end: K.atDay(0, 18, 45), anytime: false, reminders: ["At start"] }); }
      },
      cards: () => [{ type: "rows", rows: timedOf(S.items).filter((i) => !i.done && (endOf(i) || i.start) > NOW).map((i) => ({ id: i.id, title: i.title, space: i.space, when: spanTxt(i), isNew: ["email", "rent", "i2"].includes(i.id) })) }],
    };
  }
  function timeFor() {
    const fs = stretches(0, minOf(NOW), 22 * 60);
    if (!fs.length) return { text: "Today is full. Your next free stretch is tomorrow afternoon." };
    const total = fs.reduce((a, [x, y]) => a + y - x, 0);
    const best = fs.reduce((a, b) => (b[1] - b[0] > a[1] - a[0] ? b : a));
    const fit = S.inbox.filter((i) => i.duration && i.duration <= best[1] - best[0]).slice(0, 3);
    const rest = fs.filter((s) => s !== best);
    return {
      text: `You have ${K.fmtDur(total)} free today. The longest stretch is ${fmtMin(best[0])} to ${fmtMin(best[1])}${fit.length ? ", and these from your inbox fit:" : "."}`,
      cards: () => [{ type: "num", big: K.fmtDur(best[1] - best[0]), label: `free from ${fmtMin(best[0])} to ${fmtMin(best[1])}`, sub: rest.length ? `Also free: ${rest.map(([a, b]) => `${fmtMin(a)} to ${fmtMin(b)}`).join(", ")}.` : "" }, ...(fit.length ? [{ type: "fits", ids: fit.map((i) => i.id), from: best[0] }] : [])],
    };
  }
  function moveLab() {

    if (!lab || lab.done || !lab.start || lab.start.getHours() >= 13) return { text: "Write lab report 4 is already after lunch." };
    const old = { lab: spanTxt(lab), th: th ? spanTxt(th) : "", bank: bank ? K.fmtTime(bank.start) : "" };
    return {
      text: "Done. Lab report 4 now starts right after lunch, so the thesis reading moves back an hour and the bank call to 16:30. Your morning is free until 12:30.",

  function leftTomorrow() {

  function study() {

    const item = { id, kind: "task", title: p.title, space: p.space, duration: p.duration, repeat: p.repeat, reminders: p.reminders, notes: "", start, end: start && p.duration ? new Date(start.getTime() + p.duration * 60000) : null, anytime: !start };

      if (v === "delete") { haptic("warning"); commit(`Deleted "${it.title}"`, () => { S.items = S.items.filter((x) => x !== it); S.week = S.week.filter((x) => x !== it); }); return "rendered"; }
    },
    "rv-next"() { S.rv.step += 1; S.rv.picking = false; haptic("selection"); scrollTo(0, 0); },
    "rv-dec"(el) { rvDecide(el.dataset.id, el.dataset.v); return "rendered"; },
    "rv-pick"() { S.rv.picking = !S.rv.picking; },
    "rv-keep"(el) { S.rv.kept = [...S.rv.kept, el.dataset.id]; haptic("selection"); },
    "rv-feel"(el) { S.rv.feel = +el.dataset.v; haptic("selection"); sound("tick"); },
    "rv-close"() { S.rv.step = 4; haptic("success"); sound("done"); scrollTo(0, 0); },
    "ask-chip"(el) { askSubmit(el.dataset.v); return "rendered"; },
    "ask-place"(el) { haptic("success"); sound("tick"); placeInbox(el.dataset.id, 0, +el.dataset.min); return "rendered"; },
    "msg-undo"(el) { const m = S.chat[+el.dataset.v]; if (!m || !m.snap || m.undone) return; Object.assign(S, structuredClone(m.snap)); m.undone = true; haptic("light"); toast("Undone"); },
    mic() { toast("Voice works in the installed app. Type here for now."); },
    "coach-x"(el) { S.coachGone.push(el.dataset.id); haptic("light"); },
    "coach-do"(el) { const c = COACH.find((x) => x.id === el.dataset.id); S.coachGone.push(c.id); haptic("success"); toast(c.done); },
    "run-toggle"(el) { S.runOpen = S.runOpen === el.dataset.id ? null : el.dataset.id; },
    "run-undo"(el) { const r = S.runs.find((x) => x.id === el.dataset.id), x = r.items[+el.dataset.v]; haptic("light"); commit(`Undid: ${x.text}`, () => { applyRun(x, false); x.state = "undone"; }); return "rendered"; },
    "run-redo"(el) { const r = S.runs.find((x) => x.id === el.dataset.id), x = r.items[+el.dataset.v]; haptic("light"); commit(`Redid: ${x.text}`, () => { applyRun(x, true); x.state = "done"; }); return "rendered"; },
    "run-edit"(el) { const r = S.runs.find((x) => x.id === el.dataset.id), x = r.items[+el.dataset.v]; if (getAny(x.ref)) openTask(x.ref); },
    set(el) { const k = el.dataset.v; S.set[k] = !S.set[k]; if (S.set[k] && k === "sound") sound("done"); if (S.set[k] && k === "haptics") haptic("selection"); },
    "set-review"(el) { S.set.review = el.dataset.v; haptic("selection"); },
    "feel-test"() { haptic("success"); sound("done"); },
    noop() {},
    copy(el) { try { navigator.clipboard && navigator.clipboard.writeText(el.dataset.v); } catch (e) {} toast("Copied"); },
    undo() { if (S.toast && S.toast.snap) Object.assign(S, S.toast.snap); S.toast = null; clearTimeout(toastT); haptic("light"); },
  };

  let suppressClick = false, suppressT = 0, lastGap = { k: null, t: 0 };
  const suppress = () => { suppressClick = true; clearTimeout(suppressT); suppressT = setTimeout(() => (suppressClick = false), 450); };
  document.addEventListener("click", (e) => {
    if (suppressClick) { suppressClick = false; e.preventDefault(); e.stopPropagation(); return; }
    if (S.lp && !e.target.closest(".lpmenu")) { S.lp = null; render(); return; }
    if (S.swOpen && !e.target.closest(".sw-bg")) { S.swOpen = null; render(); return; }
    const gap = e.target.closest("[data-gap]");
    if (gap && !e.target.closest("button")) {
      const now = Date.now();
      if (lastGap.k === gap.dataset.gap && now - lastGap.t < 380) { lastGap = { k: null, t: 0 }; openAddAt(+gap.dataset.gap); return; }
      lastGap = { k: gap.dataset.gap, t: now }; return;
    }
    const el = e.target.closest("[data-act]");
    if (!el) { if (S.menu && !e.target.closest(".pop")) { S.menu = null; render(); } return; }
    const fn = A[el.dataset.act]; if (!fn) return;
    e.stopPropagation();
    if (fn(el, e) !== "rendered") render();
  });
  document.addEventListener("submit", (e) => {
    const f = e.target.closest("[data-ask]"); if (!f) return;
    e.preventDefault(); askSubmit(f.querySelector("input").value);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if (S.lp) S.lp = null;
      else if (S.ts.picker && S.openTask) S.ts.picker = null;
      else if (S.add.open) S.add.open = false;
      else if (S.menu) S.menu = null;
      else if (S.openTask) { if (mode === "phone" && document.getElementById("tsheet")) { closeSheet(0); return; } S.openTask = null; }
      else if (S.screen === "focus") S.screen = "today";
      else return;
      render(); return;
    }
    if ((e.ctrlKey || e.metaKey) && (e.key === "k" || e.key === "K")) {
      e.preventDefault();
      const a = document.getElementById("ask-in"); if (a) { a.focus(); return; }
      S.prev = S.screen; S.screen = "assistant"; S.openTask = null; S.add.open = false; render();
      const b = document.getElementById("ask-in"); if (b) b.focus(); return;
    }
    const t = e.target;
    if (t.id === "qa-in" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submitAdd(); haptic("success"); return; }
    if (t.id === "sub-new" && e.key === "Enter" && t.value.trim()) {
      const it = getAny(S.openTask); it.subtasks = [...(it.subtasks || []), { title: t.value.trim(), done: false }]; render();
      const n = document.getElementById("sub-new"); if (n) n.focus(); return;
    }
    if ((e.key === "Enter" || e.key === " ") && t.matches(".row[data-act]")) { e.preventDefault(); t.click(); return; }
    const editing = t.isContentEditable || /INPUT|TEXTAREA/.test(t.tagName);
    if (!editing && (e.key === "n" || e.key === "N") && !e.metaKey && !e.ctrlKey) { e.preventDefault(); S.add = { open: true, text: "", kind: "task" }; render(); }
  });
  document.addEventListener("input", (e) => {
    const t = e.target;
    if (t.id === "qa-in") { S.add.text = t.value; updateAdd(); return; }
    if (t.id === "ask-in") { S.askText = t.value; return; }
    if (t.dataset && t.dataset.edit) { const it = getAny(t.dataset.id); if (it) it[t.dataset.edit] = t.innerText; }
  });

  // ---------- gestures (phone): sheet drag, row swipe and hold, review card swipe ----------
  let drag = null;
  document.addEventListener("pointerdown", (e) => {
    if (e.button) return;
    const head = mode === "phone" && e.target.closest("[data-sheet-drag]");
    if (head && !e.target.closest(".iconbtn")) {
      stopSheet();
      drag = { kind: "sheet", y0: e.clientY, s0: typeof S.ts.y === "number" ? S.ts.y : detentY(S.ts.det), last: e.clientY, lt: e.timeStamp, v: 0, moved: false };
      return;
    }
    const card = e.target.closest("#rv-card");
    if (card) { drag = { kind: "rv", el: card, x0: e.clientX, y0: e.clientY, dx: 0, dir: null, lx: e.clientX, lt: e.timeStamp, v: 0, arm: "" }; return; }
    const sw = mode === "phone" && e.target.closest(".sw");
    if (sw && !e.target.closest(".sw-bg") && !e.target.closest(".tick")) {
      const row = sw.querySelector(".row"); const id = sw.dataset.sw;
      const base = S.swOpen && S.swOpen.id === id ? S.swOpen.x : 0;
      const d = { kind: "row", sw, row, id, x0: e.clientX, y0: e.clientY, base, x: base, dir: null, armed: false, lx: e.clientX, lt: e.timeStamp, v: 0 };
      drag = d;
      row.classList.add("pressing");
      d.lp = setTimeout(() => { if (drag !== d || d.dir) return; row.classList.remove("pressing"); suppress(); S.lp = id; S.swOpen = null; drag = null; haptic("light"); sound("soft"); render(); }, 480);
    }
  });
  document.addEventListener("pointermove", (e) => {
    const d = drag; if (!d) return;
    const now = e.timeStamp;
    if (d.kind === "sheet") {
      const dy = e.clientY - d.y0; if (Math.abs(dy) > 4) d.moved = true;
      let y = d.s0 + dy; if (y < 0) y = y / 3;
      d.v = ((e.clientY - d.last) / Math.max(1, now - d.lt)) * 1000; d.last = e.clientY; d.lt = now;
      S.ts.y = y; setSheet(y); return;
    }
    const dx = e.clientX - d.x0, dy = e.clientY - d.y0;
    if (!d.dir) {
      if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) { d.dir = "h"; if (d.kind === "row") { clearTimeout(d.lp); d.row.classList.remove("pressing"); d.sw.classList.add("swiping"); } }
      else if (Math.abs(dy) > 8) { d.dir = "v"; if (d.kind === "row") { clearTimeout(d.lp); d.row.classList.remove("pressing"); } drag = null; return; }
      else return;
    }
    d.v = ((e.clientX - d.lx) / Math.max(1, now - d.lt)) * 1000; d.lx = e.clientX; d.lt = now;
    if (d.kind === "rv") {
      d.dx = dx; d.el.style.transform = `translateX(${dx}px) rotate(${dx / 26}deg)`;
      const w = d.el.offsetWidth, arm = dx > w * 0.3 ? "r" : dx < -w * 0.3 ? "l" : "";
      if (arm !== d.arm) { d.arm = arm; d.el.dataset.arm = arm; if (arm) haptic("selection"); }
      return;
    }
    const x = d.base + dx; d.x = x;
    d.row.style.transform = `translateX(${x}px)`;
    d.sw.classList.toggle("dir-r", x > 0); d.sw.classList.toggle("dir-l", x < 0);
    const arm = Math.abs(x) > d.sw.offsetWidth * 0.45;
    if (arm !== d.armed) { d.armed = arm; d.sw.classList.toggle("armed", arm); haptic(arm ? "selection" : "light"); }
  });
  function springRow(d, to, v, done) { return spring(d.x, to, v, (x) => { d.x = x; d.row.style.transform = `translateX(${x}px)`; }, done, 520, 40); }
  function endDrag() {
    const d = drag; if (!d) return; drag = null;
    if (d.kind === "sheet") {
      if (!d.moved) return;
      suppress();
      const y = S.ts.y, med = detentY("medium");
      if (y > med + 110 || (d.v > 900 && y > med - 40)) { haptic("light"); closeSheet(d.v); return; }
      const target = d.v < -600 ? "large" : d.v > 600 ? "medium" : Math.abs(y) < Math.abs(y - med) ? "large" : "medium";
      if (target !== S.ts.det) haptic("selection");
      S.ts.det = target; animateSheet(detentY(target), d.v); return;
    }
    if (d.kind === "rv") {
      if (d.dir !== "h") return;
      suppress();
      const w = d.el.offsetWidth, id = d.el.dataset.id;
      const fly = (dir, v) => {
        if (reduceMotion) { rvDecide(id, v); return; }
        d.el.style.transition = "transform .2s cubic-bezier(.4,0,1,1)"; d.el.style.transform = `translateX(${dir * innerWidth}px) rotate(${dir * 14}deg)`;
        setTimeout(() => rvDecide(id, v), 190);
      };
      if (d.dx > w * 0.3 || d.v > 900) fly(1, "1");
      else if (d.dx < -w * 0.3 || d.v < -900) fly(-1, "letgo");
      else spring(d.dx, 0, d.v, (x) => { d.el.style.transform = `translateX(${x}px) rotate(${x / 26}deg)`; }, () => { d.el.style.transform = ""; d.el.dataset.arm = ""; });
      return;
    }
    clearTimeout(d.lp); d.row.classList.remove("pressing");
    if (d.dir !== "h") return;
    suppress();
    const w = d.sw.offsetWidth, x = d.x, it = getAny(d.id);
    if (x > w * 0.45 || (d.v > 1200 && x > 40)) springRow(d, w, d.v, () => swDone(it));
    else if (x < -w * 0.45 || (d.v < -1200 && x < -40)) springRow(d, -w, d.v, () => swMove(it, 1));
    else if (x > 56) { S.swOpen = { id: d.id, x: 120 }; d.sw.classList.add("open"); springRow(d, 120, d.v); haptic("light"); }
    else if (x < -56) { S.swOpen = { id: d.id, x: -184 }; d.sw.classList.add("open"); springRow(d, -184, d.v); haptic("light"); }
    else { if (S.swOpen && S.swOpen.id === d.id) S.swOpen = null; springRow(d, 0, d.v, () => d.sw.classList.remove("swiping", "dir-l", "dir-r", "armed", "open")); }
  }
  document.addEventListener("pointerup", endDrag);
  document.addEventListener("pointercancel", () => {
    const d = drag; drag = null; if (!d) return;
    if (d.kind === "row") { clearTimeout(d.lp); d.row.classList.remove("pressing"); if (d.dir === "h") springRow(d, 0, 0); }
    else if (d.kind === "sheet") animateSheet(detentY(S.ts.det), 0);
    else if (d.kind === "rv") { d.el.style.transform = ""; d.el.dataset.arm = ""; }
  });

  // pull down on Today to add, pinch to switch list and timeline
  let pull = null, pinch = null;
  const pullEl = () => { let p = document.getElementById("pullind"); if (!p) { p = document.createElement("div"); p.id = "pullind"; p.className = "pullind"; p.setAttribute("aria-hidden", "true"); document.body.appendChild(p); } return p; };
  const hidePull = () => { const p = document.getElementById("pullind"); if (p) p.remove(); };
  const dist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  document.addEventListener("touchstart", (e) => {
    if (mode !== "phone" || S.screen !== "today" || S.openTask || S.add.open) return;
    if (e.touches.length === 2) { pull = null; hidePull(); pinch = { d0: dist(e.touches), done: false }; return; }
    if (e.touches.length === 1 && scrollY <= 0 && e.target.closest(".phone") && !e.target.closest(".sw")) pull = { y0: e.touches[0].clientY, armed: false };
  }, { passive: true });
  document.addEventListener("touchmove", (e) => {
    if (pinch && e.touches.length === 2 && !pinch.done) {
      const r = dist(e.touches) / pinch.d0;
      if (r < 0.75 || r > 1.33) { pinch.done = true; S.view = r < 1 ? "list" : "timeline"; haptic("selection"); render(); }
      return;
    }
    if (!pull) return;
    const dy = e.touches[0].clientY - pull.y0;
    if (dy < 0 || scrollY > 0) { pull = null; hidePull(); return; }
    const p = pullEl(); const arm = dy > 90;
    p.style.transform = `translate(-50%, ${Math.min(60, dy / 2)}px)`; p.style.opacity = String(Math.min(1, dy / 60));
    p.innerHTML = `${ic("plus")}${arm ? "Release to add a task" : "Pull to add a task"}`;
    if (arm !== pull.armed) { pull.armed = arm; if (arm) haptic("selection"); }
  }, { passive: true });
  document.addEventListener("touchend", () => {
    if (pinch) pinch = null;
    if (!pull) return; const a = pull.armed; pull = null; hidePull();
    if (a) { haptic("light"); S.add = { open: true, text: "", kind: "task" }; render(); }
  });

  // drag to timebox (desktop week)
  let dragId = null, dropMin = null;
  const clearGhost = () => document.querySelectorAll(".ghostb").forEach((g) => g.remove());
  document.addEventListener("dragstart", (e) => { const c = e.target.closest && e.target.closest("[data-drag]"); if (!c) return; dragId = c.dataset.drag; e.dataTransfer.setData("text/plain", dragId); e.dataTransfer.effectAllowed = "move"; });
  document.addEventListener("dragover", (e) => {
    const col = e.target.closest && e.target.closest(".wcol"); if (!col || !dragId) return;
    e.preventDefault();
    const r = col.getBoundingClientRect();
    let min = Math.round(((e.clientY - r.top) / HPX_WEEK) * 4) * 15 + H0 * 60;
    min = Math.max(H0 * 60, Math.min(21 * 60 + 45, min));
    if (min === dropMin && col.querySelector(".ghostb")) return;
    dropMin = min; clearGhost();
    const it = S.inbox.find((i) => i.id === dragId);
    const g = document.createElement("div");
    g.className = "ghostb";
    g.style.top = `${((min - H0 * 60) / 60) * HPX_WEEK}px`;
    g.style.height = `${it && it.duration ? (it.duration / 60) * HPX_WEEK - 2 : 22}px`;
    g.textContent = `${String(Math.floor(min / 60)).padStart(2, "0")}:${String(min % 60).padStart(2, "0")}${it && it.duration ? "" : " · no length"}`;
    col.appendChild(g);
  });
  document.addEventListener("drop", (e) => {
    const col = e.target.closest && e.target.closest(".wcol"); if (!col || !dragId) return;
    e.preventDefault(); clearGhost();
    const id = dragId; dragId = null;
    placeInbox(id, +col.dataset.day, dropMin);
  });
  document.addEventListener("dragend", () => { dragId = null; clearGhost(); });

  let lastMode = innerWidth >= 900 ? "desktop" : "phone";
  addEventListener("resize", () => { const m = innerWidth >= 900 ? "desktop" : "phone"; if (m !== lastMode) { lastMode = m; render(); } });
  addEventListener("message", (e) => { if (e.data && e.data.screen) { const sc = e.data.screen === "agents" ? "assistant" : e.data.screen; S.openTask = sc === "task" ? "lab" : null; S.ts = { det: "medium", y: null, anim: null, picker: null, custom: false }; S.add.open = sc === "add"; if (sc === "add") S.add.text = EXAMPLE; S.screen = ["task", "add"].includes(sc) ? "today" : sc; render(); } });
  if (scr === "review") S.rv = { step: 0, queue: null, picking: false, feel: null, note: null, kept: [] };
  render();
})();
</script>
</body>
</html>
