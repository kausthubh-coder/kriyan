}

// Grabber drag: two heights, flick picks one, far enough down closes
function bindSheetDrag() {
  const sh = $("#sheet"); const g = sh && $("[data-grab]", sh);
  if (!g || isDesk()) return;
  let y0 = 0, h0 = 0, lastY = 0, lastT = 0, v = 0;
  g.addEventListener("pointerdown", (e) => { y0 = lastY = e.clientY; lastT = e.timeStamp; h0 = sh.offsetHeight; sh.classList.add("dragging"); g.setPointerCapture(e.pointerId); });
  g.addEventListener("pointermove", (e) => {
    if (!sh.classList.contains("dragging")) return;
    v = (e.clientY - lastY) / Math.max(1, e.timeStamp - lastT); lastY = e.clientY; lastT = e.timeStamp;
    const dy = e.clientY - y0;
    if (dy > 0) sh.style.transform = `translateY(${dy}px)`; else sh.style.height = `${Math.min(innerHeight * 0.92, h0 - dy)}px`;
  });
  const end = (e) => {
    if (!sh.classList.contains("dragging")) return;
    sh.classList.remove("dragging"); sh.style.transform = "";
    const dy = e.clientY - y0, proj = dy + v * 200;
    if (proj > h0 * 0.4) return closeSheet();
    sh.style.height = proj < -60 ? `${Math.round(innerHeight * 0.92)}px` : `${Math.min(560, Math.round(innerHeight * 0.88))}px`;
  };
  g.addEventListener("pointerup", end); g.addEventListener("pointercancel", end);
}

// ---------- Swipe rows (phone) ----------
function bindSwipes() {
  if (isDesk()) return;
  document.querySelectorAll("[data-swipe]").forEach((wrap) => {
    const id = wrap.dataset.swipe; if (!id) return;
    const row = $(".row", wrap), bg = $(".row-bg", wrap);
    let x0 = 0, y0 = 0, dx = 0, mode = null, armed = false;
    wrap.addEventListener("pointerdown", (e) => { if (e.pointerType === "mouse" && e.button) return; x0 = e.clientX; y0 = e.clientY; dx = 0; mode = "pending"; armed = false; });
    wrap.addEventListener("pointermove", (e) => {
      if (!mode) return;
      const mx = e.clientX - x0, my = e.clientY - y0;
      if (mode === "pending") {
        if (Math.abs(my) > 10 && Math.abs(my) > Math.abs(mx)) { mode = null; return; }
        if (Math.abs(mx) > 10) { mode = "drag"; row.classList.add("dragging"); wrap.classList.add("swiping"); wrap.setPointerCapture(e.pointerId); }
        else return;
      }
      dx = mx;
      const w = wrap.offsetWidth;
      const pull = dx > 0 ? dx : dx * 0.6; // leading edge only commits; trailing reveals "Tomorrow"
      row.style.transform = `translateX(${pull}px)`;
      bg.className = `row-bg ${dx > 0 ? "done" : "later"}`;
      bg.innerHTML = dx > 0 ? `<span class="lab">${ic("check")}${item(id)?.done ? "Not done" : "Done"}</span>` : `<span class="lab">Tomorrow${ic("later")}</span>`;
      const nowArmed = Math.abs(dx) > w * 0.4;
      if (nowArmed !== armed) { armed = nowArmed; bg.classList.toggle("armed", armed); if (armed) buzz(8); }
    });
    const up = () => {
      if (mode !== "drag") { mode = null; return; }
      mode = null; row.classList.remove("dragging"); row.classList.add("settle"); setTimeout(() => wrap.classList.remove("swiping"), 240);
      row.style.transform = "";
      setTimeout(() => row.classList.remove("settle"), 240);
      if (armed) { if (dx > 0) toggleDone(id); else moveTomorrow(id); }
      wrap.dataset.justSwiped = "1"; setTimeout(() => delete wrap.dataset.justSwiped, 50);
    };
    wrap.addEventListener("pointerup", up); wrap.addEventListener("pointercancel", up);
  });
}

// ---------- Desktop drag to timebox ----------
function bindWeekDrag() {
  if (!isDesk() || S.screen !== "week") return;
  document.querySelectorAll(".ibx[draggable]").forEach((el) => {
    el.addEventListener("dragstart", (e) => { e.dataTransfer.setData("text/plain", el.dataset.id); e.dataTransfer.effectAllowed = "move"; S.dragId = el.dataset.id; });
  });
  document.querySelectorAll("[data-drop]").forEach((col) => {
    let ghost = null;
    const at = (e) => {
      const r = col.getBoundingClientRect();
      const mins = Math.round((((e.clientY - r.top) / HOUR_PX) * 60) / 15) * 15;
      const tot = H0 * 60 + Math.max(0, mins);
      return { h: Math.floor(tot / 60), m: tot % 60, top: (tot / 60 - H0) * HOUR_PX };
    };
    col.addEventListener("dragover", (e) => {
      e.preventDefault(); col.classList.add("over");
      const t = S.inbox.find((x) => x.id === S.dragId); const p = at(e);
      if (!ghost) { ghost = document.createElement("div"); ghost.className = "wg-ghost"; col.appendChild(ghost); }
      ghost.style.top = p.top + "px"; ghost.style.height = ((t?.duration || 30) / 60) * HOUR_PX + "px";
      ghost.textContent = `${String(p.h).padStart(2, "0")}:${String(p.m).padStart(2, "0")}${t && !t.duration ? " · no duration" : ""}`;
    });
    col.addEventListener("dragleave", () => { col.classList.remove("over"); ghost?.remove(); ghost = null; });
    col.addEventListener("drop", (e) => { e.preventDefault(); col.classList.remove("over"); ghost?.remove(); ghost = null; const p = at(e); placeInbox(e.dataTransfer.getData("text/plain"), +col.dataset.drop, p.h, p.m); });
  });
}

// ---------- Actions ----------
function toggleDone(id) {

  move1: (el) => { S.moved[el.dataset.id] = true; item(el.dataset.id).movedOut = true; render(); },
  unmove: (el) => { delete S.moved[el.dataset.id]; item(el.dataset.id).movedOut = false; render(); },
  accept: (el) => { const p = S.proposals.find((x) => x.id === el.dataset.id); p.status = "accepted"; applyProposal(p, true); render(); toast("Proposal accepted", () => { p.status = "open"; applyProposal(p, false); render(); }); },
  decline: (el) => { const p = S.proposals.find((x) => x.id === el.dataset.id); p.status = "declined"; render(); },
  reopen: (el) => { const p = S.proposals.find((x) => x.id === el.dataset.id); if (p.status === "accepted") applyProposal(p, false); p.status = "open"; render(); },
  perm: () => { S.agentsDirect = !S.agentsDirect; render(); },
  copy: (el) => { navigator.clipboard?.writeText(el.dataset.v).catch(() => {}); toast("Copied"); },
  "close-sheet": () => closeSheet(),
  "qa-add": () => addFromQA(),
  "qa-dur": () => { S.qa.pop = S.qa.pop === "qa-dur" ? null : "qa-dur"; updateQA(); },
  "qa-rem": () => { S.qa.pop = S.qa.pop === "qa-rem" ? null : "qa-rem"; updateQA(); },
  "qa-none": () => { $("#qa-input")?.focus(); },
  "qa-setdur": (el) => { S.qa.overrides.duration = el.dataset.v ? +el.dataset.v : null; S.qa.pop = null; updateQA(); },
  "qa-addrem": (el) => { (S.qa.overrides.reminders ||= []).push(el.dataset.v); updateQA(); },
  new: () => openSheet(""),
};
function applyProposal(p, on) {
  if (p.id === "p1") {
    if (on) { const t = S.inbox.find((x) => x.id === "i1"); if (t) { S.inbox = S.inbox.filter((x) => x !== t); p._t = t; S.week.push(p._b = { id: "wp1", day: 2, kind: "task", title: t.title, space: t.space, start: K.atDay(2, 14, 0), end: K.atDay(2, 16, 0), duration: 120, isNew: true }); } }
    else { S.week = S.week.filter((w) => w.id !== "wp1"); if (p._t) S.inbox.unshift(p._t); }
  }
  if (p.id === "p2") { const lab = item("lab"); if (on) { p._s = lab.subtasks; lab.subtasks = [{ title: "Run the benchmark 5 times", done: true }, { title: "Make the timing chart (30m)", done: false }, { title: "Write the discussion (45m)", done: false }, { title: "Proofread and submit (15m)", done: false }]; } else if (p._s) lab.subtasks = p._s; }
  if (p.id === "p3") { if (on) S.week.push({ id: "wp3", day: 1, kind: "task", title: "Submit lab report 4 (due 17:00)", space: "comp2310", start: K.atDay(1, 16, 30), end: K.atDay(1, 16, 45), duration: 15, isNew: true }); else S.week = S.week.filter((w) => w.id !== "wp3"); }
}

// ---------- Command menu ----------
const CMDS = [
  { t: "New task", k: "n", kw: "add create todo", run: () => openSheet("") },
  { t: "Go to Today", k: "g t", kw: "home day", run: () => go("today") },
  { t: "Go to Week", k: "g w", kw: "plan calendar timebox schedule", run: () => go("week") },
  { t: "Go to Goals and habits", k: "g g", kw: "habit streak progress time left", run: () => go("goals") },
  { t: "Close the day", k: "g r", kw: "review shutdown evening move", run: () => go("review") },
  { t: "Go to Agents", k: "g a", kw: "mcp cli claude codex proposals", run: () => go("agents") },
  { t: "Start focus on next block", k: "f", kw: "timer pomodoro timebox start", run: () => { const n = nextUp(); if (n) startFocus(n.id); } },
  { t: "Open Write lab report 4", k: "", kw: "task detail lab", run: () => { S.selected = "lab"; go("today"); } },
  { t: "Switch to dark theme", k: "", kw: "dark mode night appearance", run: () => { document.documentElement.dataset.theme = "dark"; } },
  { t: "Switch to light theme", k: "", kw: "light mode day appearance", run: () => { document.documentElement.dataset.theme = "light"; } },
];
function cmdOpen() { S.cmd = { q: "", sel: 0 }; S.lastFocus = document.activeElement; setInert(true); renderCmd(); $("#cmd-in")?.focus(); }
function cmdClose() { S.cmd = null; setInert(!!S.sheet); renderCmd(); S.lastFocus?.focus?.(); }
function cmdMatches() {
  const q = S.cmd.q.toLowerCase().trim();
  if (!q) return CMDS.map((c) => ({ c }));
  return CMDS.map((c) => {
    const inT = c.t.toLowerCase().includes(q);
    const kw = c.kw.split(" ").find((w) => w.startsWith(q) || q.split(" ").every((p) => w.includes(p)));
    return inT ? { c } : kw ? { c, kw } : null;
  }).filter(Boolean);
}
function renderCmd() {
  const root = $("#cmdroot");
  if (!S.cmd) { root.innerHTML = ""; return; }
  const m = cmdMatches();
  S.cmd.sel = Math.min(S.cmd.sel, Math.max(0, m.length - 1));
  const list = m.map((x, n) => `<li role="option" id="cmd-${n}" aria-selected="${n === S.cmd.sel}" data-n="${n}"><span>${esc(x.c.t)}</span>${x.kw ? `<em>matches "${esc(x.kw)}"</em>` : ""}${x.c.k ? x.c.k.split(" ").map((k) => `<kbd>${k.toUpperCase()}</kbd>`).join("") : ""}</li>`).join("") || `<li aria-disabled="true"><span class="muted">No command for "${esc(S.cmd.q)}"</span></li>`;
  if (!$("#cmd-in")) {
    root.innerHTML = `<div class="scrim open" style="z-index:69" data-cmd-close></div><div class="cmd" role="dialog" aria-modal="true" aria-label="Command menu" data-why="Critly: Command Menu | Opens with no animation, matches what you mean (\'dark\' finds the theme), and shows each shortcut so you learn it.">
      <input id="cmd-in" role="combobox" aria-expanded="true" aria-controls="cmd-list" placeholder="Type a command or search" autocomplete="off" spellcheck="false">
      <ul id="cmd-list" role="listbox"></ul><div class="foot">↑ ↓ to move · Enter to run · Esc to close</div></div>`;
    $("#cmd-in").addEventListener("input", (e) => { S.cmd.q = e.target.value; S.cmd.sel = 0; renderCmd(); });
    $("[data-cmd-close]").addEventListener("click", cmdClose);
  }
  $("#cmd-list").innerHTML = list;
  $("#cmd-in").setAttribute("aria-activedescendant", `cmd-${S.cmd.sel}`);
  root.querySelectorAll("li[data-n]").forEach((li) => li.addEventListener("click", () => { const c = m[+li.dataset.n].c; cmdClose(); c.run(); }));
}

// ---------- Shell ----------
const NAV = [["today", "Today", "today", "T"], ["week", "Week", "week", "W"], ["goals", "Goals", "goal", "G"], ["review", "Close the day", "review", "R"], ["agents", "Agents", "agent", "A"]];
function sideHTML() {
  const sp = K.spaces;
  return `<div class="brand"><i></i>Kriyan</div>
    <div class="side-add"><button class="btn btn-quiet" data-act="new">${ic("plus", "sm")}<span style="flex:1;text-align:left">New task</span><span class="kbd">N</span></button></div>
    ${NAV.map(([s, l, i, k]) => `<button class="nav" data-act="go" data-s="${s}" aria-current="${S.screen === s || (s === "today" && (S.screen === "task" || S.screen === "focus")) ? "page" : "false"}">${ic(i)}<span>${l}</span>${s === "agents" && S.proposals.some((p) => p.status === "open") ? `<span class="num muted" style="font-size:var(--t-meta)">${S.proposals.filter((p) => p.status === "open").length}</span>` : ""}</button>`).join("")}
    <h4>Spaces</h4>
    ${sp.filter((s) => !s.parent).map((s) => `<div class="sp">${sdot(s.id)}${esc(s.name)}</div>${sp.filter((c) => c.parent === s.id).map((c) => `<div class="sp child">${sdot(c.id)}${esc(c.name)}</div>`).join("")}`).join("")}
    <div class="side-left"><b>${K.timeLeft.yearDaysLeft}</b> days left in 2026<br><b>${K.timeLeft.semesterWeeksLeft}</b> weeks of semester<br><span style="display:inline-flex;gap:8px;align-items:center;margin-top:8px"><span class="kbd">⌘K</span> Commands</span></div>`;
}
function tabsHTML() {
  const tabs = [["today", "Today", "today"], ["week", "Week", "week"], ["goals", "Goals", "goal"], ["agents", "Agents", "agent"]];
  const cur = S.screen === "task" || S.screen === "focus" || S.screen === "review" ? "today" : S.screen;
  return `${tabs.map(([s, l, i]) => `<button class="tab" data-act="go" data-s="${s}" aria-current="${cur === s ? "page" : "false"}">${ic(i)}${l}</button>`).join("")}
    <button class="tab-add" data-act="new" aria-label="New task">${ic("plus")}</button>`;
}
function render() {
  const desk = isDesk();
  const app = $("#app");
  let main = "", panel = "";
  const sc = S.screen;
  if (sc === "task" && !desk) main = detailHTML(item(S.selected || "lab"));
  else if (sc === "focus") main = focusHTML();
  else if (sc === "week") main = weekMain();
  else if (sc === "goals") main = goalsMain();
  else if (sc === "review") main = reviewMain();
  else if (sc === "agents") main = agentsMain();
  else main = todayMain();
  if (desk) {
    const sel = S.selected && item(S.selected);
    panel = sel && !sel.deleted ? detailHTML(sel) : (sc === "today" || sc === "task") ? todayPanel() : "";
    app.classList.toggle("no-panel", !panel);
  }
  if (sc !== "task") S.prev = sc;
  $("#main").innerHTML = main;
  $("#panel").innerHTML = panel;
  $("#side").innerHTML = desk ? sideHTML() : "";
  $("#tabbar").innerHTML = desk ? "" : tabsHTML();
  $("#tabbar").style.display = !desk && (sc === "focus" || sc === "task") ? "none" : "";
  $("#nextbar").innerHTML = nextbarHTML();
  document.title = `Kriyan, ${sc}`;
  bindSwipes(); bindWeekDrag();
  document.querySelectorAll(".code code").forEach((c) => {
    const upd = () => c.classList.toggle("more", c.scrollLeft + c.clientWidth < c.scrollWidth - 2);
    upd(); c.addEventListener("scroll", upd, { passive: true });
  });
}
function setInert(on) { ["#app", "#tabbar", "#nextbar", "#toasts"].forEach((q) => { const el = $(q); if (el) el.inert = on; }); }
function renderSheet() { $("#sheetroot").innerHTML = sheetHTML(); bindSheetDrag(); setInert(!!S.sheet || !!S.cmd); }

// ---------- Events ----------
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) { if (S.remMenu && !e.target.closest(".menu")) { S.remMenu = false; render(); } return; }
  const f = ACT[el.dataset.act];
  if (f) { e.preventDefault(); f(el); }
});
document.addEventListener("keydown", (e) => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.target.isContentEditable;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); S.cmd ? cmdClose() : cmdOpen(); return; }
  if (S.cmd) {
    const m = cmdMatches();
    if (e.key === "Escape") { e.preventDefault(); cmdClose(); }
    else if (e.key === "ArrowDown") { e.preventDefault(); S.cmd.sel = Math.min(m.length - 1, S.cmd.sel + 1); renderCmd(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); S.cmd.sel = Math.max(0, S.cmd.sel - 1); renderCmd(); }
    else if (e.key === "Enter" && m[S.cmd.sel]) { e.preventDefault(); const c = m[S.cmd.sel].c; cmdClose(); c.run(); }
    return;
  }
  if (e.key === "Escape") {
    if (S.sheet) { e.preventDefault(); closeSheet(); return; }
    if (S.remMenu) { S.remMenu = false; render(); return; }
    if (S.selected && isDesk()) { S.selected = null; render(); return; }
  }
  if (S.sheet && e.key === "Enter" && e.target.id === "qa-input" && !e.shiftKey) { e.preventDefault(); addFromQA(); return; }
  if (e.target.matches?.('[data-act="sub-add"]') && e.key === "Enter" && e.target.value.trim()) {
    item(e.target.dataset.id).subtasks.push({ title: e.target.value.trim(), done: false }); render(); $('[data-act="sub-add"]')?.focus(); return;
  }
  if (e.target.matches?.('[role=button][data-act="open"]') && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); ACT.open(e.target); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "n") { e.preventDefault(); openSheet(""); }
  else if (k === "f") { const n = nextUp(); if (n) startFocus(n.id); }
  else if (S.g) { S.g = false; const m = { t: "today", w: "week", g: "goals", r: "review", a: "agents" }[k]; if (m) go(m); }
  else if (k === "g") { S.g = true; setTimeout(() => (S.g = false), 900); }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "qa-input") { S.qa.text = e.target.value; updateQA(); }
  if (e.target.matches('[data-act="title"]')) { const i = item(e.target.dataset.id); i.title = e.target.value; }
});
let lastDesk = isDesk();
addEventListener("resize", () => { if (isDesk() !== lastDesk) { lastDesk = isDesk(); render(); renderSheet(); } });

// ---------- Deep links ----------
const scr = params.get("screen") || "today";
if (scr === "task") { S.selected = "lab"; S.screen = isDesk() ? "today" : "task"; render(); }
else if (scr === "add") { S.screen = "today"; render(); openSheet("Gym tomorrow 7am for 45m every Mon Wed Fri remind 10m before #health"); }
else if (scr === "focus") { S.screen = "today"; render(); startFocus("lab"); }
else if (["today", "week", "goals", "review", "agents"].includes(scr)) { S.screen = scr; render(); }
else render();
})();
</script>
</body>
</html>
